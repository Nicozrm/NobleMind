<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOBLEmind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
/* ═══════════ Basis ═══════════ */
:root{
  --bg:#000000; --surface:#0A0A0B; --raised:#121214; --border:#1A1A1D;
  --text:#EDECE8; --muted:#98978F; --faint:#5F5E59; --accent:#C9A962;
  --blur:28px; --r:12px; --rg:18px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.6 Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
code,kbd,pre,.mono{font-family:"JetBrains Mono",monospace}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

/* ═══════════ Liquid Glass ═══════════ */
.glass{
  background:color-mix(in srgb,var(--surface) 62%,transparent);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(180%);
  backdrop-filter:blur(var(--blur)) saturate(180%);
  border:1px solid color-mix(in srgb,#fff 8%,transparent);
  box-shadow:
    inset 0 1px 0 color-mix(in srgb,#fff 12%,transparent),
    inset 0 -1px 0 color-mix(in srgb,#000 24%,transparent),
    0 18px 48px -24px rgba(0,0,0,.75);
}
@media (prefers-reduced-transparency:reduce){
  .glass{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .glass{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}
}

/* ═══════════ Layout ═══════════ */
#app{display:flex;height:100%;height:100dvh}
#sb{
  width:260px;flex:none;display:flex;flex-direction:column;
  border-right:1px solid var(--border);background:var(--bg);
  transition:margin .2s var(--ease);z-index:40;
}
body.sb-zu #sb{margin-left:-260px}
#main{flex:1;position:relative;display:flex;flex-direction:column;min-width:0}
#schleier{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:39;opacity:0;pointer-events:none;transition:opacity .2s var(--ease)}
@media(max-width:900px){
  #sb{position:fixed;inset:0 auto 0 0;margin-left:-268px;border-right:0}
  body.sb-zu #sb{margin-left:-268px}
  body.sb-auf #sb{margin-left:0}
  body.sb-auf #schleier{opacity:1;pointer-events:auto}
}

/* Sidebar */
.sb-marke{display:flex;align-items:center;gap:8px;padding:18px 16px 10px;font-weight:600;letter-spacing:.4px}
.sb-marke b{font-weight:700}
.sb-punkt{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.sb-tabs{display:flex;gap:16px;margin:8px 16px 4px}
.sb-tabs button{padding:4px 0;font-size:12px;color:var(--faint);border-bottom:1px solid transparent;letter-spacing:.2px;border-radius:0}
.sb-tabs button.aktiv{color:var(--text);border-bottom-color:var(--accent)}
.sb-tabs button:hover{color:var(--muted)}
#sbListe{flex:1;overflow-y:auto;padding:6px 10px}
.eintrag{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--muted);position:relative}
.eintrag:hover{background:var(--raised);color:var(--text)}
.eintrag.aktiv{background:var(--raised);color:var(--text)}
.eintrag .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.eintrag .av{flex:none;width:20px;text-align:center}
.eintrag .mehr{flex:none;opacity:0;font-size:15px;padding:0 3px;border-radius:6px;color:var(--faint)}
.eintrag:hover .mehr{opacity:1}
.eintrag .mehr:hover{color:var(--text)}
.sb-neu{margin:6px 10px;padding:8px 14px;border:0;border-radius:10px;color:var(--faint);font-size:13px;text-align:left}
.sb-neu:hover{color:var(--text);background:var(--raised)}
#hud{border-top:1px solid var(--border);padding:12px 16px;font-size:11.5px;color:var(--faint)}
#hud .balken{height:3px;background:var(--surface);border-radius:99px;margin:6px 0;overflow:hidden}
#hud .balken i{display:block;height:100%;background:var(--accent);width:0;border-radius:99px;transition:width .3s var(--ease)}
#hud.warnung .balken i{background:#D9707A}
#hud.warnung #hudProzent{color:#D9707A}
#hud .hz{display:flex;justify-content:space-between}

/* Kopfzeile */
#hd{
  position:absolute;top:0;left:0;right:0;z-index:20;height:56px;
  display:flex;align-items:center;gap:8px;padding:0 14px;
  padding-top:env(safe-area-inset-top);
  border-bottom:1px solid transparent;transition:border-color .2s;
}
#hd.gescrollt{border-bottom-color:color-mix(in srgb,#fff 8%,transparent)}
.ikn{width:34px;height:34px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;color:var(--muted);font-size:16px}
.ikn:hover{background:var(--raised);color:var(--text)}
#kopfModell{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--text);max-width:280px}
#kopfModell:hover{background:var(--raised)}
#kopfModell .pfeil{color:var(--faint);font-size:10px}
#kopfTitel{flex:1;text-align:center;font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;padding:6px 10px;border-radius:8px}
#kopfTitel:hover{color:var(--text)}
body.zen #sb,body.zen #hd .zenweg{display:none}

/* Chat */
#chat{flex:1;overflow-y:auto;padding:76px 16px 190px;scroll-behavior:smooth}
#spalte{max-width:760px;margin:0 auto}
.msg{margin:26px 0;animation:auftauchen .18s var(--ease)}
@keyframes auftauchen{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.u{display:flex;flex-direction:column;align-items:flex-end}
.msg.u .blase{background:var(--raised);border-radius:20px 20px 6px 20px;padding:10px 16px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg .fuss{display:flex;gap:2px;align-items:center;margin-top:6px;opacity:0;transition:opacity .15s;flex-wrap:wrap}
.msg:hover .fuss,.msg:focus-within .fuss{opacity:1}
.msg .fuss button{font-size:11px;color:var(--faint);padding:3px 7px;border-radius:7px}
.msg .fuss button:hover{color:var(--text);background:var(--raised)}
.msg .fuss .meta{font-size:10.5px;color:var(--faint);margin-left:8px;font-family:"JetBrains Mono",monospace}
.msg .fehlerbox{color:#E58C96;font-size:13px;border-left:2px solid #D9707A;padding:6px 12px;margin:8px 0;white-space:pre-wrap}
.msg .hinweisbox{color:var(--muted);font-size:12px;font-style:italic;margin-top:6px}
.blitz{animation:blitzen 1.6s var(--ease)}
@keyframes blitzen{0%,60%{background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:12px}100%{background:transparent}}

/* Markdown */
.md{line-height:1.72;overflow-wrap:anywhere}
.md>*:first-child{margin-top:0}
.md p{margin:.7em 0}
.md h1,.md h2,.md h3,.md h4{margin:1.2em 0 .5em;line-height:1.3;font-weight:600}
.md h1{font-size:1.45em}.md h2{font-size:1.25em}.md h3{font-size:1.1em}.md h4{font-size:1em}
.md ul,.md ol{padding-left:1.4em;margin:.6em 0}
.md li{margin:.25em 0}
.md blockquote{border-left:2px solid var(--border);color:var(--muted);padding:2px 14px;margin:.8em 0}
.md hr{border:0;border-top:1px solid var(--border);margin:1.4em 0}
.md table{border-collapse:collapse;margin:.9em 0;display:block;overflow-x:auto;font-size:13.5px}
.md th,.md td{border-bottom:1px solid var(--border);padding:6px 12px;text-align:left}
.md th{color:var(--muted);font-weight:600}
.md code{background:var(--raised);padding:1px 5px;border-radius:5px;font-size:.86em}
.md pre{margin:0}
.md pre code{background:none;padding:0;font-size:13px;line-height:1.55}
.md img{max-width:100%;border-radius:var(--r)}
.cb{margin:14px 0;border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.cb-kopf{display:flex;align-items:center;gap:8px;padding:5px 12px;background:#0D0D0F;border-bottom:1px solid var(--border);font-size:11px;color:var(--muted);font-family:"JetBrains Mono",monospace}
.cb-kopf .sp{flex:1}
.cb-kopf button{font-size:11px;color:var(--faint);padding:2px 7px;border-radius:6px}
.cb-kopf button:hover{color:var(--text);background:var(--raised)}
.cb pre{padding:13px 14px;overflow-x:auto;background:#08080A}
.lauf-rahmen{width:100%;height:240px;border:0;border-top:1px solid var(--border);background:#fff}
.bildreihe img{max-width:100%;border-radius:var(--r);margin:8px 0;display:block}

/* Chips · Gedankengang · Quellen */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px 11px;font-family:"JetBrains Mono",monospace}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--faint);flex:none}
.chip.laeuft i{background:var(--accent);animation:puls 1.1s infinite}
.chip.fertig i{background:#5FBD92}
@keyframes puls{0%,100%{opacity:1}50%{opacity:.25}}
.denkKnopf{font-size:11.5px;color:var(--faint);padding:3px 0;margin-bottom:6px;display:inline-flex;gap:6px;align-items:center}
.denkKnopf:hover{color:var(--muted)}
.denk{display:none;border-left:2px solid var(--border);padding:4px 14px;margin:4px 0 12px;color:var(--muted);font-size:13px;white-space:pre-wrap}
.denk.offen{display:block}
.quellen{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.quellen:empty{display:none}
.quellen a{display:inline-flex;align-items:center;gap:6px;max-width:230px;font-size:11.5px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px 11px;overflow:hidden}
.quellen a:hover{color:var(--text);text-decoration:none;border-color:var(--faint)}
.quellen a b{color:var(--accent);font-weight:500;font-family:"JetBrains Mono",monospace}
.quellen a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Duell */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.duoSeite{min-width:0;border-top:2px solid var(--border);padding-top:8px}
.duoSeite.gewonnen{border-top-color:var(--accent)}
.duoName{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:8px;font-family:"JetBrains Mono",monospace}
@media(max-width:640px){.duo{grid-template-columns:1fr}}

/* Workflow-Block */
.wfKopf{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;margin-bottom:10px}
.wfKopf .status{font-size:11.5px;color:var(--muted);font-weight:400;font-family:"JetBrains Mono",monospace}
.wfZeile{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid color-mix(in srgb,var(--border) 55%,transparent);cursor:pointer;font-size:13.5px}
.wfZeile .punkt{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.wfZeile .punkt.laeuft{background:var(--accent);animation:puls 1.1s infinite}
.wfZeile .punkt.fertig{background:#5FBD92}
.wfZeile .punkt.fehler{background:#D9707A}
.wfZeile .punkt.uebersprungen{background:transparent;border:1px solid var(--faint)}
.wfZeile .wt{flex:1}
.wfZeile .wm{font-size:11px;color:var(--faint);font-family:"JetBrains Mono",monospace}
.wfAus{display:none;border-left:2px solid var(--border);padding:4px 14px;margin:2px 0 10px 3px;font-size:13.5px}
.wfAus.offen{display:block}
.wfFuss{margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
.wfFuss .gesamt{font-size:11.5px;color:var(--faint);font-family:"JetBrains Mono",monospace;margin-bottom:8px}

/* Composer */
#compHalter{position:absolute;bottom:0;left:0;right:0;z-index:21;padding:0 16px calc(14px + env(safe-area-inset-bottom));pointer-events:none}
#comp{max-width:760px;margin:0 auto;border-radius:26px;padding:10px 12px;pointer-events:auto}
#anhaengeZeile{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
#anhaengeZeile:empty{display:none}
.anhPille{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;background:var(--raised);border:1px solid var(--border);border-radius:999px;padding:3px 6px 3px 11px;color:var(--muted)}
.anhPille button{color:var(--faint);font-size:13px;padding:0 4px}
.anhPille button:hover{color:var(--text)}
#compZeile{display:flex;align-items:flex-end;gap:6px}
#eingabe{flex:1;background:none;border:0;color:var(--text);font:inherit;resize:none;max-height:200px;padding:6px 4px;line-height:1.5}
#eingabe:focus{outline:none}
#eingabe::placeholder{color:var(--faint)}
#senden{width:36px;height:36px;flex:none;border-radius:999px;background:var(--accent);color:#0B0B0C;font-size:15px;display:inline-flex;align-items:center;justify-content:center;transition:transform .15s var(--ease),opacity .15s}
#senden:hover{transform:translateY(-1px)}
#senden:disabled{opacity:.35;transform:none;cursor:default}
#senden.stopp{background:var(--raised);color:var(--text);border:1px solid var(--border)}
#mikro.aktiv{color:#D9707A;animation:puls 1.2s infinite}

/* Leerzustand */
#leer{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;gap:10px}
#leer h1{font-size:30px;font-weight:700;letter-spacing:1px}
#leer h1 i{color:var(--accent);font-style:normal}
#leer p{color:var(--muted);font-size:14px;max-width:420px}
#leer .beispiele{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
#leer .beispiele button{font-size:12.5px;color:var(--muted);background:var(--raised);border-radius:999px;padding:7px 15px}
#leer .beispiele button:hover{color:var(--text)}

/* Knöpfe · Formulare */
.kn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid transparent;background:var(--raised);border-radius:10px;font-size:13px;color:var(--text);transition:border-color .15s,background .15s}
.kn:hover{border-color:var(--border)}
.kn.primaer{background:var(--accent);border-color:var(--accent);color:#0B0B0C;font-weight:600}
.kn.primaer:hover{background:color-mix(in srgb,var(--accent) 88%,#fff)}
.kn.gefahr{color:#E58C96}
.kn.klein{padding:4px 10px;font-size:12px}
.ein{width:100%;background:var(--raised);border:1px solid transparent;border-radius:10px;padding:8px 11px;color:var(--text);font:inherit;font-size:13.5px}
.ein:focus{outline:none;border-color:var(--accent)}
textarea.ein{resize:vertical;min-height:60px;line-height:1.5}
select.ein{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.sw{position:relative;display:inline-block;width:34px;height:20px;flex:none}
.sw input{position:absolute;opacity:0;width:100%;height:100%;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;background:var(--raised);border:1px solid var(--border);border-radius:999px;transition:background .15s}
.sw span::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .15s var(--ease),background .15s}
.sw input:checked+span{background:var(--accent);border-color:var(--accent)}
.sw input:checked+span::after{transform:translateX(14px);background:#0B0B0C}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.zeile{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid color-mix(in srgb,var(--border) 55%,transparent)}
.zeile .zl{font-size:13.5px}
.hinweisK{font-size:11.5px;color:var(--faint);margin-top:2px;line-height:1.45}
.feldB{margin:14px 0}
.feldB>label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500}
.schieber{display:flex;align-items:center;gap:10px}
.schieber input[type=range]{flex:1;accent-color:var(--accent)}
.schieber .wert{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);min-width:36px;text-align:right}

/* Popover */
.pop{position:fixed;z-index:70;min-width:220px;max-width:340px;max-height:60vh;overflow-y:auto;border-radius:14px;padding:6px;animation:auftauchen .14s var(--ease)}
.pop .pk{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.8px;padding:8px 10px 4px}
.pop .pe{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 10px;border-radius:9px;font-size:13px;color:var(--text)}
.pop .pe:hover{background:var(--raised)}
.pop .pe .av{width:20px;text-align:center;flex:none}
.pop .pe .haken{margin-left:auto;color:var(--accent);font-size:12px}
.pop .pe .pb{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop .trenn{border-top:1px solid color-mix(in srgb,var(--border) 60%,transparent);margin:5px 8px}
.pop .zeile{padding:6px 10px;border-bottom:0}

/* Modale */
.schleierFix{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:18px;animation:einblenden .15s var(--ease)}
@keyframes einblenden{from{opacity:0}to{opacity:1}}
.schleierFix.aus{display:none}
.modalBox{border-radius:var(--rg);width:min(880px,96vw);height:min(660px,90vh);display:flex;overflow:hidden;animation:auftauchen .18s var(--ease)}
.modalBox.breit{width:min(1020px,96vw)}
.modalNav{width:190px;flex:none;border-right:1px solid color-mix(in srgb,var(--border) 70%,transparent);padding:16px 8px;overflow-y:auto}
.modalNav .mtitel{font-size:13px;font-weight:600;padding:0 10px 10px}
.modalNav button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:9px;font-size:13px;color:var(--muted);margin:1px 0}
.modalNav button:hover{color:var(--text);background:var(--raised)}
.modalNav button.aktiv{color:var(--text);background:var(--raised)}
.modalKoerper{flex:1;overflow-y:auto;padding:20px 24px;min-width:0}
.modalKoerper h2{font-size:16px;font-weight:600;margin-bottom:6px}
.modalZu{position:absolute;top:12px;right:12px;z-index:5}
.modalBox{position:relative}
@media(max-width:700px){.modalBox{flex-direction:column;height:min(92vh,760px)}.modalNav{width:100%;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--border);padding:10px}.modalNav .mtitel{display:none}.modalNav button{width:auto;white-space:nowrap}}

/* Dialog */
.dlgBox{border-radius:var(--rg);width:min(440px,94vw);padding:22px;animation:auftauchen .18s var(--ease)}
.dlgBox h3{font-size:15px;margin-bottom:6px}
.dlgBox .dtext{font-size:13px;color:var(--muted);margin-bottom:10px;line-height:1.5}
.dlgBox .dfehler{font-size:12px;color:#E58C96;margin-top:8px;white-space:pre-wrap}
.dlgBox .dfehler:empty{display:none}
.dlgKnoepfe{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.dlgBox.gross{width:min(620px,94vw)}

/* Palette */
#pal{position:fixed;inset:0;z-index:85;display:flex;justify-content:center;align-items:flex-start;padding-top:14vh;background:rgba(0,0,0,.4)}
#pal.aus{display:none}
#palBox{width:min(580px,92vw);border-radius:var(--rg);overflow:hidden;animation:auftauchen .16s var(--ease)}
#palEingabe{width:100%;background:none;border:0;border-bottom:1px solid color-mix(in srgb,var(--border) 70%,transparent);padding:15px 18px;color:var(--text);font:inherit;font-size:15px}
#palEingabe:focus{outline:none}
#palListe{max-height:46vh;overflow-y:auto;padding:6px}
#palListe .pe{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border-radius:10px;font-size:13.5px}
#palListe .pe .art{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.6px;margin-left:auto;flex:none}
#palListe .pe.markiert{background:var(--raised)}
#palListe .pe .pb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#palLeer{padding:18px;text-align:center;color:var(--faint);font-size:13px}

/* Toasts */
#toasts{position:fixed;top:14px;right:14px;z-index:100;display:flex;flex-direction:column;gap:8px;max-width:min(360px,90vw)}
.toast{border-radius:14px;padding:11px 16px;font-size:13px;animation:auftauchen .2s var(--ease);border-left:2px solid var(--faint)}
.toast.ok{border-left-color:#5FBD92}
.toast.fehler{border-left-color:#D9707A}
.toast.hinweis{border-left-color:var(--accent)}

/* Sprach-Overlay */
#sprachOv{position:fixed;inset:0;z-index:90;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center}
#sprachOv.aus{display:none}
#svKreis{width:150px;height:150px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--muted);transition:border-color .3s,transform .3s var(--ease)}
#sprachOv[data-z="hoert"] #svKreis{border-color:var(--accent);animation:atmen 1.6s infinite}
#sprachOv[data-z="verarbeitet"] #svKreis,#sprachOv[data-z="denkt"] #svKreis{border-color:var(--muted);animation:puls 1.1s infinite}
#sprachOv[data-z="spricht"] #svKreis{border-color:#5FBD92;transform:scale(1.06)}
@keyframes atmen{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
#svZustand{font-size:13px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;font-family:"JetBrains Mono",monospace}
#svText{max-width:560px;max-height:34vh;overflow-y:auto;color:var(--text);font-size:15px;line-height:1.6}
#svText .frage{color:var(--muted);font-size:13px;margin-bottom:10px}

/* Editor-Listen (Agenten/Workflows) */
.edListe{width:250px;flex:none;border-right:1px solid color-mix(in srgb,var(--border) 70%,transparent);display:flex;flex-direction:column}
.edListe .kopf{display:flex;align-items:center;justify-content:space-between;padding:16px 14px 8px;font-size:13px;font-weight:600}
.edListe .rollen{flex:1;overflow-y:auto;padding:4px 8px}
.edForm{flex:1;overflow-y:auto;padding:20px 24px;min-width:0}
.edForm h2{display:flex;align-items:center;gap:10px;font-size:16px;margin-bottom:4px}
.spalten2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
@media(max-width:700px){.edListe{width:100%;max-height:170px;border-right:0;border-bottom:1px solid var(--border)}.modalBox.breit{flex-direction:column}.spalten2{grid-template-columns:1fr}}
.kachelReihe{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.kachel{font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:4px 12px;cursor:pointer;user-select:none}
.kachel.an{color:var(--text);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.kachel.gesperrt{opacity:.4;cursor:not-allowed}

/* Workflow-Editor */
.wfSchrittKarte{border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin:10px 0;background:var(--surface)}
.wfSchrittKarte.parallelMit{border-left:2px solid var(--accent)}
.wfSchrittKarte.ungueltig{border-color:#D9707A}
.wfSchrittKarte .kopfz{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.wfSchrittKarte .griff{cursor:grab;color:var(--faint);font-size:14px;padding:0 2px}
.wfSchrittKarte .nr{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--faint)}
.wfSchrittKarte .fehlerK{color:#E58C96;font-size:12px;margin-top:6px}
.chipEinf{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chipEinf button{font-size:11px;font-family:"JetBrains Mono",monospace;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:2px 9px}
.chipEinf button:hover{color:var(--text);border-color:var(--faint)}

/* Statistik */
.statTab{width:100%;border-collapse:collapse;font-size:12.5px;margin:10px 0}
.statTab th,.statTab td{border-bottom:1px solid var(--border);padding:6px 8px;text-align:left}
.statTab td.z,.statTab th.z{text-align:right;font-family:"JetBrains Mono",monospace}
.statTab th{color:var(--muted);font-weight:500}

/* Tasten-Overlay */
.tastTab{width:100%;font-size:13px;border-collapse:collapse}
.tastTab td{padding:6px 4px;border-bottom:1px solid color-mix(in srgb,var(--border) 55%,transparent)}
.tastTab kbd{background:var(--raised);border:1px solid var(--border);border-radius:6px;padding:2px 7px;font-size:11.5px}

/* Canvas */
#canvas{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);z-index:60;display:flex;flex-direction:column;border-left:1px solid color-mix(in srgb,#fff 7%,transparent);transform:translateX(102%);transition:transform .22s var(--ease)}
body.canvas-auf #canvas{transform:none}
#canvas .ck{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid color-mix(in srgb,#fff 6%,transparent)}
#canvas .ck .ct{flex:1;font-size:12.5px;color:var(--muted);font-family:"JetBrains Mono",monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#canvasCode{flex:1;background:#050506;border:0;color:var(--text);font:12.5px/1.55 "JetBrains Mono",monospace;padding:14px;resize:none;min-height:120px}
#canvasCode:focus{outline:none}
#canvasVorschau{flex:1.2;border:0;border-top:1px solid color-mix(in srgb,#fff 6%,transparent);background:#fff;display:none}
body.canvas-live #canvasVorschau{display:block}
.bildreihe figure a{display:inline-block;margin-top:2px}

/* Druck */
@media print{
  body{overflow:visible;background:#fff;color:#000}
  #sb,#hd,#compHalter,#toasts,#schleier,#canvas,.fuss,.chips,#hud{display:none!important}
  #app,#main{display:block;height:auto}
  #chat{overflow:visible;padding:0;height:auto}
  .msg.u .blase{background:#f0f0f0;color:#000}
  .md,.denk{color:#000}
  a{color:#333}
}

const $=(s,w)=>(w||document).querySelector(s);
const $$=(s,w)=>[...(w||document).querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>(p||'x')+'_'+Math.random().toString(36).slice(2,9);
const deb=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};
const fmtTok=n=>(n||0).toLocaleString('de-DE');
const fmtGeld=n=>((n||0)<0.01&&n>0?n.toFixed(4):(n||0).toFixed(2)).replace('.',',')+' $';
const fmtDauer=ms=>ms<1000?Math.round(ms)+' ms':(ms/1000).toFixed(1).replace('.',',')+' s';
const fmtKB=b=>(b/1024).toFixed(1).replace('.',',')+' KB';

function toast(text,art,dauer){
  const t=document.createElement('div');
  t.className='toast glass '+(art||'');
  t.textContent=text;
  $('#toasts').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),320)},dauer||3800);
}
async function kopiere(text){
  try{await navigator.clipboard.writeText(text);toast('Kopiert.','ok',1600)}
  catch{
    const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);
    ta.select();try{document.execCommand('copy');toast('Kopiert.','ok',1600)}catch{toast('Kopieren nicht möglich.','fehler')}
    ta.remove();
  }
}

/* Eigener Dialog-Baukasten – ersetzt alert/confirm/prompt */
function frageForm(o){
  return new Promise(res=>{
    const box=$('#dlg');
    const felder=(o.felder||[]).map((f,i)=>`<div class="feldB"><label for="dlgF${i}">${esc(f.label)}</label>${
      f.typ==='textarea'?`<textarea id="dlgF${i}" class="ein mono" rows="${f.zeilen||5}" placeholder="${esc(f.platz||'')}">${esc(f.wert||'')}</textarea>`
      :f.typ==='select'?`<select id="dlgF${i}" class="ein">${(f.optionen||[]).map(op=>`<option value="${esc(op.v)}" ${op.v===f.wert?'selected':''}>${esc(op.t)}</option>`).join('')}</select>`
      :`<input id="dlgF${i}" class="ein" type="${f.typ||'text'}" value="${esc(f.wert||'')}" placeholder="${esc(f.platz||'')}">`
    }</div>`).join('');
    box.innerHTML=`<div class="dlgBox glass ${o.gross?'gross':''}" role="dialog" aria-modal="true">
      <h3>${esc(o.titel||'')}</h3>${o.text?`<div class="dtext">${esc(o.text)}</div>`:''}${felder}
      <div class="dfehler" id="dlgFehler"></div>
      <div class="dlgKnoepfe"><button class="kn" id="dlgNein">Abbrechen</button>
      <button class="kn ${o.gefahr?'gefahr':'primaer'}" id="dlgJa">${esc(o.ok||'OK')}</button></div></div>`;
    box.classList.remove('aus');
    const zu=v=>{box.classList.add('aus');box.innerHTML='';res(v)};
    $('#dlgNein').onclick=()=>zu(null);
    $('#dlgJa').onclick=()=>{
      const werte={};(o.felder||[]).forEach((f,i)=>werte[f.k]=$('#dlgF'+i).value);
      if(o.pruefe){const fe=o.pruefe(werte);if(fe){$('#dlgFehler').textContent=fe;return}}
      zu(werte);
    };
    box.onkeydown=e=>{if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'){e.preventDefault();$('#dlgJa').click()}};
    const erst=$('#dlgF0');(erst||$('#dlgJa')).focus();
  });
}
const frage=(titel,label,wert,platz)=>frageForm({titel,felder:[{k:'w',label,wert,platz}]}).then(r=>r?r.w:null);
const bestaetige=(titel,text,ok)=>frageForm({titel,text,ok:ok||'Löschen',gefahr:true}).then(r=>!!r);

const LS_KEY='noblemind.v4';
let LS_OK=true;
function lsLese(){try{return localStorage.getItem(LS_KEY)}catch{LS_OK=false;return null}}
function lsSchreibe(v){try{localStorage.setItem(LS_KEY,v);return true}catch(e){return e}}

function persistierbar(){
  const kopie=JSON.parse(JSON.stringify({
    schluessel:S.merkeSchluessel?S.schluessel:'', merkeSchluessel:S.merkeSchluessel,
    cfg:S.cfg, eigeneModelle:S.eigeneModelle, agents:S.agents, workflows:S.workflows,
    skills:S.skills, fnsEigene:S.fnsEigene, mcpServer:S.mcpServer, prompts:S.prompts,
    notizen:S.notizen, sessions:S.sessions, aktiv:S.aktiv, duell:S.duell, bild:S.bild, stats:S.stats, ui:S.ui
  }));
  return kopie;
}
function speichereJetzt(){
  if(!LS_OK)return;
  const daten=persistierbar();
  let erg=lsSchreibe(JSON.stringify(daten));
  if(erg!==true){
    // Kontingent überschritten: zweiter Versuch ohne Anhänge
    daten.sessions.forEach(s=>s.messages.forEach(m=>{delete m.atts;if(m.bilder)m.bilder=[]}));
    erg=lsSchreibe(JSON.stringify(daten));
    if(erg===true)toast('Speicher knapp – Anhänge wurden nicht gesichert.','hinweis',6000);
    else toast('Speichern fehlgeschlagen: Der lokale Speicher ist voll. Bitte alte Sitzungen löschen.','fehler',8000);
  }
}
const speichern=deb(speichereJetzt,500);

function kosten(modelId,ein,aus){
  const p=modellInfo(modelId);

}

  st.ein+=ein;st.aus+=aus;st.kosten+=kosten(modelId,ein,aus);st.anrufe++;
}

function rechne(roh){
  const s=String(roh).toLowerCase().replace(/,/g,'.').replace(/\s+/g,'').replace(/×/g,'*').replace(/÷/g,'/');
  if(!/^[-+*/%^().!0-9a-z]*$/.test(s))throw Error('Unerlaubte Zeichen im Ausdruck');
  const KONST={pi:Math.PI,e:Math.E};
  const FN1={sqrt:Math.sqrt,sin:Math.sin,cos:Math.cos,tan:Math.tan,ln:Math.log,log:Math.log10,abs:Math.abs,round:Math.round,floor:Math.floor,ceil:Math.ceil,exp:Math.exp};
  let i=0;
  function nachfix(v){while(s[i]==='!'){i++;if(v<0||v!==Math.floor(v)||v>170)throw Error('Fakultät nur für kleine ganze Zahlen');let r=1;for(let k=2;k<=v;k++)r*=k;v=r}return v}
  function faktor(){
    if(s[i]==='-'){i++;return -faktor()} if(s[i]==='+'){i++;return faktor()}
    if(s[i]==='('){i++;const v=ausdruck();if(s[i++]!==')')throw Error('Schließende Klammer fehlt');return nachfix(v)}
    const m=/^[a-z]+/.exec(s.slice(i));
    if(m){i+=m[0].length;
      if(KONST[m[0]]!=null&&s[i]!=='(')return nachfix(KONST[m[0]]);
      const f=FN1[m[0]];if(!f)throw Error('Unbekannte Funktion: '+m[0]);
      if(s[i++]!=='(')throw Error('Klammer nach '+m[0]+' erwartet');
      const v=ausdruck();if(s[i++]!==')')throw Error('Schließende Klammer fehlt');return nachfix(f(v))}
    const n=/^\d*\.?\d+(e[+-]?\d+)?/.exec(s.slice(i));
    if(!n)throw Error('Zahl erwartet an Position '+i);
    i+=n[0].length;return nachfix(parseFloat(n[0]));
  }
  function potenz(){const v=faktor();if(s[i]==='^'){i++;return Math.pow(v,potenz())}return v}
  function term(){let v=potenz();while('*/%'.includes(s[i])){const o=s[i++];const r=potenz();v=o==='*'?v*r:o==='/'?v/r:v%r}return v}
  function ausdruck(){let v=term();while(s[i]==='+'||s[i]==='-'){const o=s[i++];v=o==='+'?v+term():v-term()}return v}
  const v=ausdruck();
  if(i<s.length)throw Error('Unerwartete Zeichen: '+s.slice(i));
  if(!isFinite(v))throw Error('Ergebnis ist nicht endlich');
  return v;
}
const EINHEITEN={'km-mi':v=>v*0.621371,'mi-km':v=>v*1.609344,'m-ft':v=>v*3.28084,'ft-m':v=>v/3.28084,
  'kg-lb':v=>v*2.204623,'lb-kg':v=>v/2.204623,'g-oz':v=>v*0.035274,'oz-g':v=>v/0.035274,
  'l-gal':v=>v*0.264172,'gal-l':v=>v/0.264172,'c-f':v=>v*9/5+32,'f-c':v=>(v-32)*5/9,
  'kmh-mph':v=>v*0.621371,'mph-kmh':v=>v*1.609344};

const FNS={
  rechner:{beschreibung:'Wertet einen mathematischen Ausdruck sicher aus (z. B. „sqrt(2)*17^2“).',
    parameter:{type:'object',properties:{ausdruck:{type:'string',description:'Mathematischer Ausdruck'}},required:['ausdruck'],additionalProperties:false},

  wetter:{beschreibung:'Aktuelles Wetter und 3-Tage-Vorhersage über Open-Meteo (ohne Schlüssel).',
    parameter:{type:'object',properties:{ort:{type:'string',description:'Ortsname, z. B. „Berlin“'}},required:['ort'],additionalProperties:false},
    lauf:async a=>{
      const g=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=de&name='+encodeURIComponent(a.ort)).then(r=>r.json());
      const o=g.results&&g.results[0];
      if(!o)return 'Ort nicht gefunden: '+a.ort;
      const w=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${o.latitude}&longitude=${o.longitude}&current_weather=true&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=4`).then(r=>r.json());
      return JSON.stringify({ort:o.name+', '+(o.country||''),aktuell:w.current_weather,vorhersage:w.daily});
    }},
  einheiten:{beschreibung:'Rechnet Einheiten um: km/mi, m/ft, kg/lb, g/oz, l/gal, °C/°F, km/h/mph.',
    parameter:{type:'object',properties:{wert:{type:'number'},von:{type:'string',description:'z. B. km, kg, °C, km/h'},nach:{type:'string'}},required:['wert','von','nach'],additionalProperties:false},
    lauf:a=>{
      const n=x=>String(x).toLowerCase().replace(/[°\s/]/g,'').replace('celsius','c').replace('fahrenheit','f');
      const f=EINHEITEN[n(a.von)+'-'+n(a.nach)];
      if(!f)return 'Umrechnung nicht unterstützt: '+a.von+' → '+a.nach;
      return a.wert+' '+a.von+' = '+(Math.round(f(a.wert)*10000)/10000)+' '+a.nach;
    }},
  zufall:{beschreibung:'Erzeugt Zufallszahlen oder Würfelwürfe.',
    parameter:{type:'object',properties:{min:{type:'integer'},max:{type:'integer'},anzahl:{type:'integer'}},required:[],additionalProperties:false},
    lauf:a=>{
      const min=a.min??1,max=a.max??100,n=Math.min(a.anzahl??1,100);
      const erg=Array.from({length:n},()=>min+Math.floor(Math.random()*(max-min+1)));
      return JSON.stringify(n===1?erg[0]:erg);
    }},
  seiten_text:{beschreibung:'Holt den sichtbaren Text einer URL (kann an CORS scheitern).',
    parameter:{type:'object',properties:{url:{type:'string'}},required:['url'],additionalProperties:false},

      try{

        const doc=new DOMParser().parseFromString(html,'text/html');

      }catch(e){return 'Abruf fehlgeschlagen ('+(e.message||'CORS oder Netzwerk')+'). Die Seite erlaubt vermutlich keinen Browser-Zugriff.'}

function kompiliere(code){
  if(!R.fnCache[code]){
    const AF=Object.getPrototypeOf(async function(){}).constructor;
    R.fnCache[code]=new AF('args',code);
  }
  return R.fnCache[code];
}

async function sessionUmbenennen(id){
  const s=S.sessions.find(x=>x.id===id);if(!s)return;
  const t=await frage('Sitzung umbenennen','Titel',s.titel);
  if(t){s.titel=t.trim()||s.titel;zeigeAlles();speichern()}
}
async function sessionLoeschen(id){
  if(!await bestaetige('Sitzung löschen','Alle Nachrichten dieser Sitzung werden dauerhaft entfernt.'))return;
  S.sessions=S.sessions.filter(x=>x.id!==id);
  if(S.aktiv===id)S.aktiv=S.sessions[0]?.id||null;
  zeigeAlles();speichern();
}
function forkSession(id){
  const s=S.sessions.find(x=>x.id===id);if(!s)return;

/* Popover-Grundgerüst */
function zeigePop(anker,html,breite){
  schliessePop();
  const p=document.createElement('div');
  p.className='pop glass';p.innerHTML=html;
  if(breite)p.style.width=breite+'px';
  document.body.appendChild(p);
  const r=anker.getBoundingClientRect();
  p.style.left=Math.max(8,Math.min(r.left,innerWidth-p.offsetWidth-8))+'px';
  if(r.bottom+6+p.offsetHeight>innerHeight-8)p.style.bottom=Math.max(8,innerHeight-r.top+6)+'px';
  else p.style.top=(r.bottom+6)+'px';
  R.pop=p;
  setTimeout(()=>document.addEventListener('pointerdown',popAussen,true),0);
}
function popAussen(e){if(R.pop&&!R.pop.contains(e.target))schliessePop()}
function schliessePop(){
  if(!R.pop)return;
  R.pop.remove();R.pop=null;
  document.removeEventListener('pointerdown',popAussen,true);
}

function setTool(k,v){
  const b=besitzer();
  if(k==='file'&&v&&!S.cfg.vectorStores.length){toast('Dateisuche braucht mindestens eine Vector-Store-ID (Einstellungen → Werkzeuge).','hinweis');return}
  b.tools[k]=v;speichern();
}
function setFnAn(n,v){
  const b=besitzer();b.fns=b.fns||[];
  b.fns=v?[...new Set([...b.fns,n])]:b.fns.filter(x=>x!==n);speichern();
}
function setSkillAn(id,v){
  const b=besitzer();b.skills=b.skills||[];
  b.skills=v?[...new Set([...b.skills,id])]:b.skills.filter(x=>x!==id);speichern();
}
function setMcpAn(label,v){
  const b=besitzer();b.mcps=b.mcps||[];
  b.mcps=v?[...new Set([...b.mcps,label])]:b.mcps.filter(x=>x!==label);speichern();

function maximumAn(){
  schliessePop();
  const b=besitzer();
  const aktiv=[];
  b.tools.web=true;aktiv.push('Websuche');
  b.tools.img=true;aktiv.push('Bildgenerierung');
  b.tools.code=true;aktiv.push('Code-Interpreter');
  if(S.cfg.vectorStores.length){b.tools.file=true;aktiv.push('Dateisuche ('+S.cfg.vectorStores.length+'&#8239;Stores)')}
  const alleFns=[...Object.keys(FNS),...S.fnsEigene.map(f=>f.name)];
  b.fns=[...alleFns];aktiv.push(alleFns.length+' Client-Funktionen');

  ],ok:'Erzeugen',pruefe:x=>!x.prompt.trim()?'Bitte eine Bildbeschreibung angeben.':null});

async function bildErzeuge(prompt){
  if(R.streaming){toast('Es l\u00E4uft bereits eine Antwort \u2013 erst stoppen.','hinweis');return}
  if(!S.schluessel){toast('Bitte zuerst den API-Schl\u00FCssel hinterlegen.','fehler');einstellungenAuf('engine');return}
  const sess=aktSession(true);
  sess.messages.push({id:uid('m'),role:'user',content:'Bild: '+prompt,ts:Date.now()});
  const cfg=effCfg(sess.agentId);
  const m={id:uid('m'),role:'assistant',content:'',think:'',chips:[],quellen:[],bilder:[],modell:cfg.model,ts:Date.now()};
  sess.messages.push(m);
  zeigeChat();speichern();
  R.ctrl=new AbortController();R.streaming=m.id;setzeStopp(true);
  try{
    const lauf={calls:[],id:null,usage:null,bildIdx:{}};
    await heileUndSende(()=>({model:cfg.model,stream:true,store:true,
      input:[{role:'user',content:[{type:'input_text',text:'Erzeuge genau dieses Bild: '+prompt}]}],
      tools:[bildToolDef()],tool_choice:'required'}),
      ev=>{wendeEvent(ev,m,lauf);malPlan(m)},R.ctrl.signal);
    if(lauf.usage){
      m.usage={ein:lauf.usage.input_tokens||0,aus:lauf.usage.output_tokens||0};
      verbucheNutzung(cfg.model,m.usage.ein,m.usage.aus);
      sess.kosten=(sess.kosten||0)+kosten(cfg.model,m.usage.ein,m.usage.aus);
    }
    sess.lastId=null;
  }catch(e){
    if(e&&e.name==='AbortError')m.hinweis='Abgebrochen.';
    else m.fehler=fehlerText(e);
  }
  R.streaming=null;R.ctrl=null;setzeStopp(false);
  fertigMsg(m);speichern();titelAuto(sess);
}

/* ── Markdown-Pipeline ── */
function md(t){
  if(!t)return '';
  if(window.marked&&window.DOMPurify){
    try{return DOMPurify.sanitize(marked.parse(t,{breaks:true}))}catch{}
  }
  return esc(t).replace(/\n/g,'<br>');
}
function veredle(wurzel){
  // Codeblöcke mit Kopieren/Ausführen versehen
  $$('pre',wurzel).forEach(pre=>{
    if(pre.parentElement.classList.contains('cb'))return;
    const code=pre.querySelector('code');
    const lang=((code&&code.className.match(/language-([\w-]+)/))||[])[1]||'';
    if(lang==='mermaid'&&window.mermaid){
      const box=document.createElement('div');
      pre.replaceWith(box);
      mermaid.render(uid('mm'),code.textContent).then(r=>{box.innerHTML=DOMPurify?DOMPurify.sanitize(r.svg,{USE_PROFILES:{svg:true,svgFilters:true}}):r.svg})
        .catch(()=>{box.innerHTML='<pre><code>'+esc(code.textContent)+'</code></pre>'});
      return;
    }
    const hu=document.createElement('div');hu.className='cb';
    const kopf=document.createElement('div');kopf.className='cb-kopf';
    const ausfuehrbar=['html','svg','js','javascript'].includes(lang);
    kopf.innerHTML=`<span>${esc(lang||'text')}</span><span class="sp"></span>
      <button type="button" data-t="kopieren">Kopieren</button><button type="button" data-t="canvas">Canvas</button>${ausfuehrbar?'<button type="button" data-t="lauf">Ausführen</button>':''}`;
    pre.replaceWith(hu);hu.appendChild(kopf);hu.appendChild(pre);
    kopf.querySelector('[data-t=kopieren]').onclick=()=>kopiere(code?code.textContent:pre.textContent);
    kopf.querySelector('[data-t=canvas]').onclick=()=>canvasOeffne(code?code.textContent:pre.textContent,lang||'html');
    const laufKn=kopf.querySelector('[data-t=lauf]');
    if(laufKn)laufKn.onclick=()=>fuehreCodeAus(code.textContent,lang,hu);
    if(window.hljs&&code){try{hljs.highlightElement(code)}catch{}}
  });
  if(window.renderMathInElement){
    try{renderMathInElement(wurzel,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false}],throwOnError:false})}catch{}
  }
}
function fuehreCodeAus(code,lang,halter){
  const alt=halter.querySelector('.lauf-rahmen');if(alt){alt.remove();return}
  const rahmen=document.createElement('iframe');
  rahmen.className='lauf-rahmen';rahmen.setAttribute('sandbox','allow-scripts');
  rahmen.setAttribute('title','Code-Ausführung');
  const sicher=code.replace(new RegExp('</scr'+'ipt','gi'),'<\\/scr'+'ipt');
  if(lang==='js'||lang==='javascript'){
    rahmen.srcdoc='<body style="margin:10px;font:13px monospace;background:#101012;color:#e8e8e8"><pre id="a"></pre><scr'+'ipt>const a=document.getElementById("a");const p=(...x)=>a.textContent+=x.map(v=>typeof v==="object"?JSON.stringify(v):String(v)).join(" ")+"\\n";console.log=p;console.error=p;console.warn=p;window.onerror=(m)=>p("Fehler:",m);try{'+sicher+'\n}catch(e){p("Fehler:",e.message)}</scr'+'ipt></body>';
  }else{
    rahmen.srcdoc=sicher;
  }
  halter.appendChild(rahmen);
}

function quellenHtml(z){return (z.quellen||[]).map((q,i)=>`<a href="${esc(q.url)}" target="_blank" rel="noopener"><b>${i+1}</b><span>${esc(q.titel)}</span></a>`).join('')}

function seiteGeruest(){return `<div class="chips"></div>
  <button class="denkKnopf" style="display:none" type="button">Gedankengang ▸</button><div class="denk"></div>
  <div class="bildreihe"></div><div class="txt md"></div>

function msgEl(m){
  const w=document.createElement('div');
  w.className='msg '+(m.role==='user'?'u':'a');
  w.id='me_'+m.id;
  if(m.role==='user'){
    w.innerHTML=`<div class="blase"></div><div class="fuss"></div>`;
    w.querySelector('.blase').textContent=m.content;
    if(m.atts&&m.atts.length)w.querySelector('.blase').insertAdjacentHTML('beforebegin',
      `<div class="chips" style="justify-content:flex-end">${m.atts.map(a=>`<span class="chip"><i></i>${esc(a.name)}</span>`).join('')}</div>`);
  }else if(m.wf){
    w.innerHTML=`<div class="wfBlock"></div><div class="fuss"></div>`;
  }else if(m.duell){
    w.innerHTML=`<div class="duo">
      <div class="duoSeite" data-s="a"><div class="duoName"></div>${seiteGeruest()}<div class="fuss" style="opacity:1"></div></div>
      <div class="duoSeite" data-s="b"><div class="duoName"></div>${seiteGeruest()}<div class="fuss" style="opacity:1"></div></div></div>`;
  }else{
    w.innerHTML=seiteGeruest()+'<div class="fuss"></div>';
  }
  return w;

function seiteRefs(el){
  return {chips:$('.chips',el),denkKn:$('.denkKnopf',el),denk:$('.denk',el),bilder:$('.bildreihe',el),
    txt:$('.txt',el),quellen:$('.quellen',el),fehler:$('.fehlerbox',el),hinweis:$('.hinweisbox',el)};
}
function zeichneSeite(refs,z,fertig){
  refs.chips.innerHTML=chipsHtml(z);
  refs.bilder.innerHTML=bilderHtml(z);
  refs.txt.innerHTML=md(z.content);
  refs.quellen.innerHTML=quellenHtml(z);
  if(z.think&&S.cfg.denkenZeigen){
    refs.denkKn.style.display='';
    refs.denk.textContent=z.think;
  }else refs.denkKn.style.display='none';
  refs.fehler.style.display=z.fehler?'':'none';
  refs.fehler.textContent=z.fehler||'';
  refs.hinweis.style.display=z.hinweis?'':'none';
  refs.hinweis.textContent=z.hinweis||'';
  if(fertig)veredle(refs.txt);
}
function zeichneMsg(m){
  const el=$('#me_'+m.id);if(!el)return;
  if(m.wf){zeichneWf(m);return}
  if(m.duell){
    ['a','b'].forEach(k=>{
      const seite=$(`.duoSeite[data-s=${k}]`,el);
      const z=m.duell[k];
      $('.duoName',seite).textContent=z.name;
      seite.classList.toggle('gewonnen',m.duell.gewaehlt===k);
      zeichneSeite(seiteRefs(seite),z,false);
    });
  }else if(m.role!=='user'){
    zeichneSeite(seiteRefs(el),m,false);
  }
  scrollEnde();
}
function fertigMsg(m){
  const el=$('#me_'+m.id);if(!el)return;
  if(m.wf){zeichneWf(m);return}
  if(m.duell){
    ['a','b'].forEach(k=>{
      const seite=$(`.duoSeite[data-s=${k}]`,el);
      zeichneSeite(seiteRefs(seite),m.duell[k],true);
      bindeDenk(seite);
      const f=$('.fuss',seite);
      f.innerHTML=m.duell.gewaehlt?(m.duell.gewaehlt===k?'<span class="meta">Übernommen</span>':''):
        `<button type="button" onclick="duellWaehlen('${m.id}','${k}')">Übernehmen</button>`;
      const u=m.duell[k].usage;
      if(u)f.insertAdjacentHTML('beforeend',`<span class="meta">${fmtTok(u.ein)} → ${fmtTok(u.aus)} Tok</span>`);
    });
  }else if(m.role!=='user'){
    zeichneSeite(seiteRefs(el),m,true);
    bindeDenk(el);
    fussHtml(m,el);
  }else fussHtml(m,el);
  zeigeHud();
}
function bindeDenk(el){
  const kn=$('.denkKnopf',el),d=$('.denk',el);

/* HUD: Kontextauslastung und Kosten */
function zeigeHud(){
  const s=aktSession();
  const cfg=effCfg(s?s.agentId:null);
  const info=modellInfo(cfg.model);
  let zeichen=0;
  if(s)s.messages.forEach(m=>{
    zeichen+=(m.content||'').length+(m.think||'').length;
    if(m.wf)m.wf.schritte.forEach(x=>zeichen+=(x.aus||'').length);
  });
  const tok=Math.round(zeichen/4);
  const anteil=Math.min(1,tok/info.ctx);
  $('#hudBalken').style.width=(anteil*100).toFixed(1)+'%';
  $('#hudProzent').textContent=(anteil*100).toFixed(anteil<0.1?1:0).replace('.',',')+'\u202F%';
  $('#hud').classList.toggle('warnung',anteil>=0.85);
  $('#hudModell').textContent=cfg.model+(info.geschaetzt?' · geschätzt':'');
  const gesamt=Object.values(S.stats).reduce((a,x)=>a+x.kosten,0);
  $('#hudKosten').textContent=fmtGeld(gesamt);
}

function anhangDatei(f){
  const leser=new FileReader();
  if(f.type.startsWith('image/')){
    if(f.size>18*1024*1024)return toast('Bild zu groß (max. 18\u202FMB): '+f.name,'fehler');
    leser.onload=()=>{R.anhaenge.push({art:'bild',name:f.name,groesse:f.size,data:leser.result});zeigeAnhaenge()};
    leser.readAsDataURL(f);
  }else if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){
    if(f.size>24*1024*1024)return toast('PDF zu groß (max. 24\u202FMB): '+f.name,'fehler');
    leser.onload=()=>{R.anhaenge.push({art:'pdf',name:f.name,groesse:f.size,data:leser.result});zeigeAnhaenge()};
    leser.readAsDataURL(f);
  }else if(f.type.startsWith('text/')||/\.(md|txt|json|js|ts|py|html|css|csv|xml|yml|yaml|sh|sql|java|go|rs|c|cpp|h)$/i.test(f.name)){
    if(f.size>2*1024*1024)return toast('Textdatei zu groß (max. 2\u202FMB): '+f.name,'fehler');
    leser.onload=()=>{
      const e=$('#eingabe');
      e.value=(e.value?e.value+'\n\n':'')+'```'+f.name+'\n'+leser.result+'\n```';
      passeHoeheAn();toast('Text von „'+f.name+'“ eingefügt.','ok');
    };
    leser.readAsText(f);
  }else toast('Dateityp nicht unterstützt: '+f.name,'fehler');
}

  e.style.height='auto';
  e.style.height=Math.min(e.scrollHeight,200)+'px';
}

/* ═══════════════════════════════════════ API ═══════════════════════════════════════ */
function kopfzeilen(){return {'Authorization':'Bearer '+S.schluessel,'Content-Type':'application/json'}}

async function roheAntwort(koerper,beiEvent,signal){
  const res=await fetch(API+'/responses',{method:'POST',headers:kopfzeilen(),body:JSON.stringify(koerper),signal});
  if(!res.ok){
    const txt=await res.text().catch(()=>'');
    throw {status:res.status,koerper:txt};
  }
  const leser=res.body.getReader();
  const dec=new TextDecoder();
  let puffer='';
  for(;;){
    const {done,value}=await leser.read();
    if(done)break;
    puffer+=dec.decode(value,{stream:true});
    let i;
    while((i=puffer.indexOf('\n'))>=0){
      const zeile=puffer.slice(0,i).trim();
      puffer=puffer.slice(i+1);
      if(!zeile.startsWith('data:'))continue;
      const d=zeile.slice(5).trim();
      if(d==='[DONE]')continue;
      let ev;try{ev=JSON.parse(d)}catch{continue}
      beiEvent(ev);
    }
  }
}
function fehlerText(e){
  if(!e)return 'Unbekannter Fehler';
  if(e.koerper!=null){
    try{const j=JSON.parse(e.koerper);return (j.error&&j.error.message)||('HTTP '+e.status)}
    catch{return 'HTTP '+e.status+': '+String(e.koerper).slice(0,300)}
  }
  return e.message||String(e);
}
/* Selbstheilung: Server-Meldung auswerten, Körper reduzieren, bis zu drei Wiederholungen */
async function heileUndSende(mkKoerper,beiEvent,signal){
  let k=mkKoerper(false),voll=false;
  for(let v=0;;v++){
    try{return await roheAntwort(k,beiEvent,signal)}
    catch(e){
      if((e&&e.name==='AbortError')||(signal&&signal.aborted))throw e;
      if(v>=3||e.status==null)throw e;
      const m=fehlerText(e).toLowerCase();let hinweis=null;
      if(m.includes('temperature')&&'temperature'in k){delete k.temperature;hinweis='Temperatur wird nicht unterstützt – entfernt.'}
      else if(m.includes('summary')&&k.reasoning&&k.reasoning.summary){delete k.reasoning.summary;hinweis='Reasoning-Zusammenfassung entfernt.'}
      else if(m.includes('reasoning')&&k.reasoning){delete k.reasoning;hinweis='Reasoning-Parameter entfernt.'}
      else if((m.includes('verbosity')||m.includes('format'))&&k.text){delete k.text;hinweis='Textoptionen entfernt.'}
      else if(m.includes('max_output_tokens')&&'max_output_tokens'in k){delete k.max_output_tokens;hinweis='Token-Limit entfernt.'}
      else if((m.includes('previous_response')||m.includes('not found'))&&!voll){voll=true;k=mkKoerper(true);hinweis='Verlauf wird vollständig neu aufgebaut.'}
      else throw e;
      toast(hinweis,'hinweis');
    }
  }
}

function chipName(it){
  const n={web_search_call:'Websuche',image_generation_call:'Bild',code_interpreter_call:'Code',
    file_search_call:'Dateisuche',mcp_call:it.name||'MCP',mcp_list_tools:'MCP',function_call:it.name||'Funktion'};
  return n[it.type]||it.type||'Werkzeug';
}
function setzeChip(ziel,key,status){const c=(ziel.chips||[]).find(x=>x.key===key);if(c)c.status=status}

function wendeEvent(ev,ziel,lauf){
  const t=ev.type;
  if(t==='response.created'){lauf.id=ev.response.id}
  else if(t==='response.output_item.added'){
    const it=ev.item||{};
    if(it.type&&it.type!=='message'&&it.type!=='reasoning')
      ziel.chips.push({key:it.id||uid('c'),name:chipName(it),status:'läuft'});
  }
  else if(t==='response.output_text.delta'){ziel.content+=ev.delta||''}
  else if(t==='response.reasoning_summary_text.delta'){ziel.think+=ev.delta||''}
  else if(t==='response.output_text.annotation.added'){
    const a=ev.annotation||{};
    if(a.url&&!ziel.quellen.some(q=>q.url===a.url))ziel.quellen.push({url:a.url,titel:a.title||a.url});
  }
  else if(t==='response.image_generation_call.partial_image'){
    const k=ev.item_id||'bild';
    if(lauf.bildIdx[k]==null){lauf.bildIdx[k]=ziel.bilder.length;ziel.bilder.push('')}
    ziel.bilder[lauf.bildIdx[k]]='data:image/png;base64,'+ev.partial_image_b64;
  }
  else if(t==='response.output_item.done'){
    const it=ev.item||{};
    if(it.id)setzeChip(ziel,it.id,'fertig');
    if(it.type==='function_call')lauf.calls.push({key:it.id,name:it.name,args:it.arguments,call_id:it.call_id});
    if(it.type==='image_generation_call'&&it.result){
      const k=it.id||'bild';
      if(lauf.bildIdx[k]==null){lauf.bildIdx[k]=ziel.bilder.length;ziel.bilder.push('')}
      ziel.bilder[lauf.bildIdx[k]]='data:image/png;base64,'+it.result;
    }
  }
  else if(t==='response.completed'){lauf.id=ev.response.id;lauf.usage=ev.response.usage||null}
  else if(t==='response.incomplete'){
    lauf.id=ev.response.id;lauf.usage=ev.response.usage||null;
    ziel.hinweis='Antwort unvollständig ('+((ev.response.incomplete_details||{}).reason||'Limit erreicht')+').';
  }
  else if(t==='response.failed'){throw new Error((ev.response&&ev.response.error&&ev.response.error.message)||'Anfrage fehlgeschlagen.')}
  else if(t==='error'){throw new Error(ev.message||(ev.error&&ev.error.message)||'Stream-Fehler.')}
}

/* Werkzeug-Definitionen aus wirksamer Konfiguration; Skills mischen sich hinein */
function baueTools(cfg,tiefe){
  const t=[];
  const w={...cfg.tools};
  const fns=new Set(cfg.fns||[]);
  const mcps=new Set(cfg.mcps||[]);
  (cfg.skills||[]).forEach(id=>{
    const sk=S.skills.find(x=>x.id===id);if(!sk)return;
    Object.entries(sk.tools||{}).forEach(([k,v])=>{if(v)w[k]=true});
    (sk.fns||[]).forEach(f=>fns.add(f));
  });
  if(w.web)t.push({type:'web_search'});
  if(w.img)t.push(bildToolDef());
  if(w.code)t.push({type:'code_interpreter',container:{type:'auto'}});
  if(w.file&&S.cfg.vectorStores.length)t.push({type:'file_search',vector_store_ids:[...S.cfg.vectorStores]});
  S.mcpServer.forEach(m=>{
    if(!mcps.has(m.label))return;
    const def={type:'mcp',server_label:m.label,server_url:m.url,require_approval:'never'};
    if(m.header)def.headers={Authorization:m.header};
    t.push(def);
  });
  fns.forEach(n=>{
    const f=FNS[n];
    if(f){t.push({type:'function',name:n,description:f.beschreibung,parameters:f.parameter});return}
    const e=S.fnsEigene.find(x=>x.name===n);
    if(e){
      let p;try{p=JSON.parse(e.schema)}catch{p={type:'object',properties:{},additionalProperties:false}}
      t.push({type:'function',name:e.name,description:e.beschreibung||'',parameters:p});
    }
  });
  if((cfg.handoffTo||[]).length&&(tiefe||0)<2){
    t.push({type:'function',name:'agent_uebergabe',
      description:'Übergibt einen Teilauftrag an einen anderen Agenten und liefert dessen Antwort zurück. Erlaubte Ziele: '+cfg.handoffTo.map(id=>{const a=agentVon(id);return a?a.name:id}).join(', '),
      parameters:{type:'object',properties:{ziel:{type:'string',description:'Name des Ziel-Agenten'},auftrag:{type:'string',description:'Der Teilauftrag'}},required:['ziel','auftrag'],additionalProperties:false}});
  }
  return t;
}
function bildToolDef(){
  const bd={type:'image_generation',partial_images:2};
  if(S.bild.size!=='auto')bd.size=S.bild.size;
  if(S.bild.quality!=='auto')bd.quality=S.bild.quality;
  if(S.bild.format!=='png')bd.output_format=S.bild.format;
  return bd;
}
function baueAnweisung(cfg){
  const teile=[];
  if(cfg.instructions&&cfg.instructions.trim())teile.push(cfg.instructions.trim());
  (cfg.skills||[]).forEach(id=>{const sk=S.skills.find(x=>x.id===id);if(sk&&sk.direktive)teile.push('['+sk.name+'] '+sk.direktive)});
  if(cfg.format==='markdown')teile.push('Formatiere deine Antwort in sauberem Markdown.');
  return teile.join('\n\n');
}
/* Optionale Felder nur senden, wenn gesetzt – nie null */
function baueKoerper(cfg,anweisung,eingabe,prev,werkzeuge){
  const k={model:cfg.model,input:eingabe,stream:true,store:true};
  if(anweisung)k.instructions=anweisung;
  if(prev)k.previous_response_id=prev;
  if(cfg.temperature!=null&&cfg.temperature!==1)k.temperature=cfg.temperature;
  if(cfg.maxTokens)k.max_output_tokens=cfg.maxTokens;
  if(cfg.reasoning&&cfg.reasoning!=='aus')k.reasoning={effort:cfg.reasoning,summary:'auto'};
  const txt={};
  if(cfg.verbosity&&cfg.verbosity!=='aus')txt.verbosity=cfg.verbosity;
  if(cfg.json)txt.format={type:'json_object'};
  if(Object.keys(txt).length)k.text=txt;
  if(werkzeuge.length){k.tools=werkzeuge;k.tool_choice='auto'}
  return k;
}
function userItems(m){
  const c=[];
  if(m.content)c.push({type:'input_text',text:m.content});
  (m.atts||[]).forEach(a=>{
    if(a.art==='bild')c.push({type:'input_image',image_url:a.data});
    else if(a.art==='pdf')c.push({type:'input_file',filename:a.name,file_data:a.data});
  });
  if(!c.length)c.push({type:'input_text',text:''});
  return {role:'user',content:c};
}
function baueVerlauf(sess,ohneId){
  const items=[];
  sess.messages.forEach(m=>{
    if(m.id===ohneId)return;
    if(m.role==='user'){items.push(userItems(m));return}
    const txt=m.wf?(m.wf.final||''):m.duell?(m.duell[m.duell.gewaehlt||'a'].content||''):(m.content||'');
    if(txt)items.push({role:'assistant',content:[{type:'output_text',text:txt}]});
  });
  return items;
}
function neuItems(sess,ohneId){
  for(let i=sess.messages.length-1;i>=0;i--){
    const m=sess.messages[i];
    if(m.id===ohneId)continue;
    return m.role==='user'?[userItems(m)]:null;
  }
  return null;
}
async function sicherAusfuehren(name,argsStr,cfg,tiefe,signal){
  let args={};
  try{args=argsStr?JSON.parse(argsStr):{}}catch{return 'Fehler: Argumente waren kein gültiges JSON.'}
  try{
    if(name==='agent_uebergabe')return await uebergabe(args,cfg,tiefe,signal);
    if(FNS[name])return String(await FNS[name].lauf(args));
    const e=S.fnsEigene.find(f=>f.name===name);
    if(e)return String(await kompiliere(e.code)(args));
    return 'Fehler: Unbekannte Funktion „'+name+'“.';
  }catch(err){return 'Fehler bei „'+name+'“: '+((err&&err.message)||err)}
}
async function uebergabe(args,cfg,tiefe,signal){
  const ziele=(cfg.handoffTo||[]).map(agentVon).filter(Boolean);
  const zielAgent=ziele.find(a=>a.name.toLowerCase()===String(args.ziel||'').toLowerCase())||ziele[0];
  if(!zielAgent)return 'Fehler: Kein erlaubter Ziel-Agent.';
  const z={content:'',think:'',chips:[],quellen:[],bilder:[]};
  await kernLauf({cfg:agentCfg(zielAgent),ziel:z,signal,tiefe:(tiefe||0)+1,
    verlaufVoll:()=>[{role:'user',content:[{type:'input_text',text:String(args.auftrag||'')}]}]});
  return '['+zielAgent.name+']\n'+(z.content||'(keine Antwort)');
}

/* Kern eines Gesprächszugs: Streaming plus Function-Calling-Schleife, max. 8 Runden */
async function kernLauf(o){
  const cfg=o.cfg;
  const werkzeuge=baueTools(cfg,o.tiefe||0);
  const anweisung=baueAnweisung(cfg);
  let prev=o.prevId||null;
  let eingabe=(prev&&o.neuItems)?o.neuItems:o.verlaufVoll();
  if(prev&&!o.neuItems&&!eingabe.length)prev=null;
  let gesamt={ein:0,aus:0},letzteId=null,ausgabenText='';
  for(let runde=0;runde<8;runde++){
    const lauf={calls:[],id:null,usage:null,bildIdx:{}};
    const istFolge=runde>0;
    const mk=voll=>{
      if(voll){
        prev=null;
        eingabe=istFolge
          ?o.verlaufVoll().concat([{role:'user',content:[{type:'input_text',text:'Ergebnisse der aufgerufenen Werkzeuge:\n'+ausgabenText}]}])
          :o.verlaufVoll();
      }
      return baueKoerper(cfg,anweisung,eingabe,prev,werkzeuge);
    };
    await heileUndSende(mk,ev=>{wendeEvent(ev,o.ziel,lauf);o.mal&&o.mal()},o.signal);
    if(lauf.id)letzteId=lauf.id;
    if(lauf.usage){gesamt.ein+=lauf.usage.input_tokens||0;gesamt.aus+=lauf.usage.output_tokens||0}
    o.mal&&o.mal();
    if(!lauf.calls.length)break;
    if(runde===7){o.ziel.hinweis='Werkzeug-Schleife nach 8 Runden abgebrochen.';break}
    const ausgaben=[];
    for(const c of lauf.calls){
      setzeChip(o.ziel,c.key,'läuft');o.mal&&o.mal();
      const out=await sicherAusfuehren(c.name,c.args,cfg,o.tiefe||0,o.signal);
      ausgaben.push({type:'function_call_output',call_id:c.call_id,output:String(out).slice(0,60000)});
      setzeChip(o.ziel,c.key,'fertig');o.mal&&o.mal();
    }
    ausgabenText=ausgaben.map(a=>a.output).join('\n---\n');
    prev=lauf.id;eingabe=ausgaben;
  }
  verbucheNutzung(cfg.model,gesamt.ein,gesamt.aus);
  return {id:letzteId,usage:gesamt};
}

async function antworte(sess,opt={}){
  const cfg=effCfg(sess.agentId);
  const m={id:uid('m'),role:'assistant',content:'',think:'',chips:[],quellen:[],bilder:[],modell:cfg.model,ts:Date.now()};
  sess.messages.push(m);
  zeigeChat();
  R.ctrl=new AbortController();R.streaming=m.id;setzeStopp(true);
  try{
    const erg=await kernLauf({cfg,ziel:m,signal:R.ctrl.signal,
      verlaufVoll:()=>baueVerlauf(sess,m.id),
      neuItems:opt.neuAufbau?null:neuItems(sess,m.id),
      prevId:opt.neuAufbau?null:sess.lastId,
      mal:()=>malPlan(m)});
    if(erg.id)sess.lastId=erg.id;
    m.usage=erg.usage;
    sess.kosten=(sess.kosten||0)+kosten(cfg.model,erg.usage.ein,erg.usage.aus);
  }catch(e){
    if(e&&e.name==='AbortError')m.hinweis='Abgebrochen.';
    else m.fehler=fehlerText(e);
  }
  R.streaming=null;R.ctrl=null;setzeStopp(false);
  fertigMsg(m);speichern();
  titelAuto(sess);
  if(S.ui.vorlesen&&!R.sv.aktiv&&m.content&&!m.fehler)sprich(m.content);
  return m;
}

async function sende(roh){
  const e=$('#eingabe');
  const text=(roh!=null?roh:e.value).trim();
  if(R.streaming){toast('Es läuft bereits eine Antwort – erst stoppen.','hinweis');return}
  if(!text&&!R.anhaenge.length)return;
  if(text.startsWith('/')){
    const behandelt=await verarbeiteSlash(text);
    if(behandelt){if(roh==null){e.value='';passeHoeheAn()}return}
  }
  if(!S.schluessel){toast('Bitte zuerst den API-Schlüssel hinterlegen.','fehler');einstellungenAuf('engine');return}
  const sess=aktSession(true);
  const m={id:uid('m'),role:'user',content:text,atts:R.anhaenge.splice(0),ts:Date.now()};
  sess.messages.push(m);
  if(roh==null){e.value='';passeHoeheAn()}
  zeigeAnhaenge();zeigeChat();zeigeSidebar();speichern();
  if(S.duell.an)await duellRunde(sess);
  else await antworte(sess,{});
}

/* Automatischer Sitzungstitel über einen günstigen Modellaufruf */
async function titelAuto(sess){
  if(!sess||sess.titel!=='Neue Sitzung'||sess.messages.length<2||!S.schluessel)return;
  const u=sess.messages.find(m=>m.role==='user');
  if(!u)return;
  const a=sess.messages.find(m=>m.role!=='user'&&(m.content||(m.wf&&m.wf.final)));
  try{
    const r=await fetch(API+'/responses',{method:'POST',headers:kopfzeilen(),body:JSON.stringify({
      model:'gpt-4.1-mini',store:false,max_output_tokens:24,
      input:[{role:'user',content:[{type:'input_text',text:'Gib dieser Unterhaltung einen prägnanten deutschen Titel mit höchstens fünf Wörtern. Antworte nur mit dem Titel.\n\nNutzer: '+u.content.slice(0,600)+'\n\nAssistent: '+String((a&&(a.content||(a.wf&&a.wf.final)))||'').slice(0,600)}]}]})});
    if(!r.ok)throw 0;
    const j=await r.json();
    const it=(j.output||[]).find(x=>x.type==='message');
    const t=it&&it.content&&it.content[0]&&it.content[0].text;
    if(t)sess.titel=t.trim().replace(/^["„“«»]+|["„“«».]+$/g,'').slice(0,60)||sess.titel;
    else throw 0;
  }catch{
    sess.titel=u.content.split(/\s+/).slice(0,5).join(' ').slice(0,48)||'Sitzung';
  }
  zeigeSidebar();zeigeKopf();speichern();
}

/* ── Nachrichten-Aktionen ── */
function findeMsg(id){
  const s=aktSession();if(!s)return {};
  const i=s.messages.findIndex(m=>m.id===id);
  return {s,m:s.messages[i],i};
}
function msgKopieren(id){
  const {m}=findeMsg(id);if(!m)return;
  kopiere(m.duell?(m.duell[m.duell.gewaehlt||'a'].content):(m.wf?m.wf.final:m.content)||'');
}
function msgLoeschen(id){
  const {s,m,i}=findeMsg(id);if(!m)return;
  s.messages.splice(i,1);s.lastId=null;
  zeigeChat();speichern();
}
async function msgRegenerieren(id){
  const {s,i}=findeMsg(id);
  if(i==null||i<0)return;
  if(R.streaming){toast('Erst laufenden Stream stoppen.','hinweis');return}
  s.messages.splice(i);
  s.lastId=null;zeigeChat();speichern();
  if(S.duell.an)await duellRunde(s);else await antworte(s,{neuAufbau:true});
}
async function msgWeiter(id){
  const {s,m}=findeMsg(id);
  if(!m||R.streaming)return;
  R.ctrl=new AbortController();R.streaming=m.id;setzeStopp(true);
  const cfg=effCfg(s.agentId);
  try{
    const erg=await kernLauf({cfg,ziel:m,signal:R.ctrl.signal,
      verlaufVoll:()=>baueVerlauf(s,null).concat([{role:'user',content:[{type:'input_text',text:'Fahre exakt an der Stelle fort, an der deine letzte Antwort endete. Keine Einleitung, keine Wiederholung.'}]}]),
      mal:()=>malPlan(m)});
    s.lastId=null;
    if(erg.usage)m.usage=m.usage?{ein:m.usage.ein+erg.usage.ein,aus:m.usage.aus+erg.usage.aus}:erg.usage;
  }catch(e){if(!(e&&e.name==='AbortError'))m.fehler=fehlerText(e)}
  R.streaming=null;R.ctrl=null;setzeStopp(false);
  fertigMsg(m);speichern();
}
function msgVorlesen(id){
  const {m}=findeMsg(id);if(!m)return;
  sprich(m.duell?m.duell[m.duell.gewaehlt||'a'].content:(m.wf?m.wf.final:m.content));
}
function msgBearbeiten(id){
  const {m}=findeMsg(id);
  if(!m||m.role!=='user')return;
  const el=$('#me_'+id);const blase=$('.blase',el);
  if($('textarea',blase))return;
  const alt=m.content;
  blase.innerHTML=`<textarea class="ein" rows="4" style="min-width:min(560px,70vw)"></textarea>
    <div class="dlgKnoepfe"><button class="kn klein" type="button" data-t="nein">Abbrechen</button>
    <button class="kn klein primaer" type="button" data-t="ja">Senden</button></div>`;
  const ta=$('textarea',blase);ta.value=alt;ta.focus();
  $('[data-t=nein]',blase).onclick=()=>zeigeChat();
  $('[data-t=ja]',blase).onclick=async()=>{
    const neu=ta.value.trim();if(!neu)return;
    const {s,i}=findeMsg(id);
    m.content=neu;delete m.atts;
    s.messages.splice(i+1);
    s.lastId=null;zeigeChat();speichern();
    if(S.duell.an)await duellRunde(s);else await antworte(s,{neuAufbau:true});
  };
}
function duellWaehlen(id,k){
  const {s,m}=findeMsg(id);
  if(!m||!m.duell)return;
  m.duell.gewaehlt=k;s.lastId=null;
  fertigMsg(m);speichern();
  toast('Antwort von „'+m.duell[k].name+'“ übernommen – der Verlauf wird damit fortgeführt.','ok');
}

/* ── Export · Import · Fork ── */
function ladeHerunter(name,inhalt,typ){
  const b=new Blob([inhalt],{type:typ||'text/plain;charset=utf-8'});
  const u=URL.createObjectURL(b);
  const a=document.createElement('a');
  a.href=u;a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}
function exportMd(id){
  const s=S.sessions.find(x=>x.id===(id||S.aktiv));if(!s)return;
  let out='# '+s.titel+'\n\n';
  s.messages.forEach(m=>{
    if(m.role==='user')out+='## Nutzer\n\n'+m.content+'\n\n';
    else if(m.wf)out+='## Workflow „'+m.wf.name+'“\n\n'+(m.wf.final||'(kein Ergebnis)')+'\n\n';
    else if(m.duell)out+='## Assistent (Duell: '+m.duell[m.duell.gewaehlt||'a'].name+')\n\n'+(m.duell[m.duell.gewaehlt||'a'].content||'')+'\n\n';
    else out+='## Assistent\n\n'+(m.content||'')+'\n\n';
  });
  ladeHerunter(s.titel.replace(/[^\wäöüÄÖÜß-]+/g,'_')+'.md',out,'text/markdown;charset=utf-8');
}
function exportJson(id){
  const s=S.sessions.find(x=>x.id===(id||S.aktiv));if(!s)return;
  ladeHerunter(s.titel.replace(/[^\wäöüÄÖÜß-]+/g,'_')+'.json',JSON.stringify(s,null,2),'application/json');
}
function exportAlles(){
  ladeHerunter('noblemind-v4-export.json',JSON.stringify(persistierbar(),null,2),'application/json');
}
function importKlick(){$('#importEingabe').click()}
function importVerarbeite(datei){
  const leser=new FileReader();
  leser.onload=()=>{
    try{
      const d=JSON.parse(leser.result);
      if(d&&Array.isArray(d.sessions)&&d.cfg){
        S={...S,...d};
        wendeUi();zeigeAlles();speichereJetzt();
        toast('Vollständiger Zustand importiert ('+d.sessions.length+' Sitzungen).','ok');
      }else if(d&&Array.isArray(d.messages)){
        d.id=uid('sz');d.lastId=null;
        S.sessions.unshift(d);S.aktiv=d.id;
        zeigeAlles();speichern();
        toast('Sitzung „'+(d.titel||'Import')+'“ importiert.','ok');
      }else if(d&&d.name&&d.instructions!==undefined){
        d.id=uid('ag');
        S.agents.push(d);zeigeSidebar();speichern();
        toast('Agent „'+d.name+'“ importiert.','ok');
      }else if(d&&d.name&&Array.isArray(d.steps)){
        d.id=uid('wf');
        S.workflows.push(d);zeigeSidebar();speichern();
        toast('Workflow „'+d.name+'“ importiert.','ok');
      }else toast('Unbekanntes Import-Format.','fehler');
    }catch{toast('Datei ist kein gültiges JSON.','fehler')}
  };
  leser.readAsText(datei);
}

function agSet(k,v){
  const a=agentVon(R.agAktiv);if(!a)return;
  a[k]=v;speichern();
  if(k==='name'||k==='avatar'){$('#agModal .rollen').innerHTML=agListeHtml();zeigeSidebar()}
  zeigeKopf();
}
function agModellWahl(v){
  if(v!=='__eigen'){agSet('model',v);return}
  frageForm({titel:'Eigene Modell-ID für Agent',felder:[
    {k:'id',label:'Modell-ID',platz:'z. B. gpt-5.7-preview'},
    {k:'ctx',label:'Kontextfenster (Tokens)',wert:'128000',typ:'number'},
    {k:'ein',label:'Preis Eingabe je 1 M ($)',wert:'2.5',typ:'number'},
    {k:'aus',label:'Preis Ausgabe je 1 M ($)',wert:'10',typ:'number'},
  ],pruefe:w=>!w.id.trim()?'Bitte eine Modell-ID angeben.':null}).then(w=>{
    if(w&&w.id.trim()){
      const id=w.id.trim();
      if(!MODELLE.some(m=>m.id===id)&&!S.eigeneModelle.some(m=>m.id===id))
        S.eigeneModelle.push({id,ctx:parseInt(w.ctx)||128000,ein:parseFloat(w.ein)||2.5,aus:parseFloat(w.aus)||10});
      agSet('model',id);
    }
    agRender();
  });
}
function agKachel(art,key){
  const a=agentVon(R.agAktiv);if(!a)return;
  if(art==='tools'){
    if(key==='file'&&!a.tools.file&&!S.cfg.vectorStores.length){toast('Dateisuche braucht eine Vector-Store-ID (Einstellungen → Werkzeuge).','hinweis');return}
    a.tools[key]=!a.tools[key];
  }else{
    a[art]=a[art]||[];
    a[art]=a[art].includes(key)?a[art].filter(x=>x!==key):[...a[art],key];
  }
  speichern();agRender();
}
function agNeu(){
  const a={id:uid('ag'),name:'Neuer Agent',avatar:'◇',model:S.cfg.model,instructions:'',reasoning:'aus',verbosity:'aus',
    temperature:1,maxTokens:null,tools:{web:false,img:false,code:false,file:false},fns:[],mcps:[],skills:[],outputFormat:'text',handoffTo:[]};
  S.agents.push(a);R.agAktiv=a.id;speichern();
  oeffneAgenten(a.id);zeigeSidebar();
}
function agDup(){
  const a=agentVon(R.agAktiv);if(!a)return;
  const kopie=JSON.parse(JSON.stringify(a));
  kopie.id=uid('ag');kopie.name=a.name+' (Kopie)';
  S.agents.push(kopie);R.agAktiv=kopie.id;
  speichern();agRender();zeigeSidebar();
}
async function agLoeschen(){
  const a=agentVon(R.agAktiv);if(!a)return;
  if(!await bestaetige('Agent löschen','„'+a.name+'“ wird dauerhaft entfernt. Workflows, die ihn nutzen, werden ungültig.'))return;
  S.agents=S.agents.filter(x=>x.id!==a.id);
  S.sessions.forEach(s=>{if(s.agentId===a.id)s.agentId=null});
  R.agAktiv=S.agents[0]&&S.agents[0].id;
  speichern();agRender();zeigeAlles();
}
function agExportiere(){
  const a=agentVon(R.agAktiv);if(!a)return;
  ladeHerunter('agent-'+a.name.replace(/[^\wäöüÄÖÜß-]+/g,'_')+'.json',JSON.stringify(a,null,2),'application/json');
}
function agInSitzung(){
  const a=agentVon(R.agAktiv);if(!a)return;
  aktSession(true).agentId=a.id;
  agZu();toast('Agent „'+a.name+'“ ist jetzt in der Sitzung aktiv.','ok');

async function agTest(){
  const a=agentVon(R.agAktiv);if(!a)return;
  const t=$('#agTestEin').value.trim();if(!t)return;
  if(!S.schluessel){toast('Bitte zuerst den API-Schlüssel hinterlegen.','fehler');return}
  const aus=$('#agTestAus');
  aus.innerHTML='<span class="hinweisK">läuft …</span>';
  R.testCtrl=new AbortController();
  const ziel={content:'',think:'',chips:[],quellen:[],bilder:[]};
  try{
    await kernLauf({cfg:agentCfg(a),ziel,signal:R.testCtrl.signal,
      verlaufVoll:()=>[{role:'user',content:[{type:'input_text',text:t}]}],
      mal:()=>{aus.innerHTML=chipsHtml(ziel)+md(ziel.content)}});
    aus.innerHTML=(chipsHtml(ziel)+md(ziel.content))||'<span class="hinweisK">(leere Antwort)</span>';

    aus.innerHTML='<div class="fehlerbox">'+esc(fehlerText(e))+'</div>';

  R.testCtrl=null;

/* Aufeinanderfolgende Parallel-Schritte gleicher Gruppe zu Blöcken bündeln */
function wfBloecke(steps){
  const bloecke=[];
  steps.forEach(s=>{
    const letzter=bloecke[bloecke.length-1];
    if(s.mode==='parallel'&&s.group&&letzter&&letzter[0].mode==='parallel'&&letzter[0].group===s.group)letzter.push(s);
    else bloecke.push([s]);
  });
  return bloecke;
}
function loesePlatzhalter(str,ctx){
  const fehlend=[];
  const text=String(str??'').replace(/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g,(g,k)=>{
    if(k==='input')return ctx.input??'';
    if(k==='alle')return Object.keys(ctx).filter(x=>x!=='input'&&ctx[x]!=null)
      .map((x,i)=>'['+(i+1)+' · '+x+']\n'+ctx[x]).join('\n\n');
    if(ctx[k]!=null)return ctx[k];
    fehlend.push(k);return g;
  });
  return {text,fehlend};
}
function bedingungOk(str,ctx){
  const aufl=s=>loesePlatzhalter(s,ctx).text;
  let m;
  if(m=/^(.+?)\s+enthält\s+nicht\s+(.+)$/is.exec(str))return !aufl(m[1]).toLowerCase().includes(aufl(m[2]).trim().toLowerCase());
  if(m=/^(.+?)\s+enthält\s+(.+)$/is.exec(str))return aufl(m[1]).toLowerCase().includes(aufl(m[2]).trim().toLowerCase());
  if(m=/^(.+?)\s+ist\s+nicht\s+leer\s*$/is.exec(str))return aufl(m[1]).trim()!=='';
  if(m=/^(.+?)\s+ist\s+leer\s*$/is.exec(str))return aufl(m[1]).trim()==='';
  return aufl(str).trim()!=='';
}
/* Validierung: unbekannte Platzhalter, fehlender Agent, leerer Prompt */
function wfPruefe(wf){
  const fehler=[];
  const bloecke=wfBloecke(wf.steps);
  const blockVon={};
  bloecke.forEach((b,bi)=>b.forEach(s=>blockVon[s.id]=bi));
  const phVon=t=>[...String(t||'').matchAll(/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g)].map(x=>x[1]);
  wf.steps.forEach(s=>{
    if(!s.agentId||!agentVon(s.agentId))fehler.push({id:s.id,meldung:'Kein gültiger Agent gewählt.'});
    if(!s.prompt||!s.prompt.trim())fehler.push({id:s.id,meldung:'Der Prompt ist leer.'});
    const erlaubt=new Set(['input','alle',...wf.steps.filter(x=>blockVon[x.id]<blockVon[s.id]).map(x=>x.id)]);
    [...phVon(s.prompt),...phVon(s.condition)].forEach(k=>{
      if(!erlaubt.has(k))fehler.push({id:s.id,meldung:'Platzhalter {{'+k+'}} ist hier nicht auflösbar (nur Eingabe und frühere Schritte).'});
    });
  });
  const alleIds=new Set(['input','alle',...wf.steps.map(x=>x.id)]);
  phVon(wf.output).forEach(k=>{
    if(!alleIds.has(k))fehler.push({id:'__output',meldung:'Ausgabe-Platzhalter {{'+k+'}} ist unbekannt.'});
  });
  return fehler;
}

async function wfStart(wf,eingabe){
  const sess=aktSession(true);
  const lauf={wfId:wf.id,name:wf.name,eingabe,fertig:false,final:'',kosten:0,ms:0,fehlerText:'',uebernommen:false,
    schritte:wf.steps.map((s,i)=>({id:s.id,titel:s.title||('Schritt '+(i+1)),status:'wartet',aus:'',ms:0,tok:0,offen:false,fehlerText:''}))};
  const m={id:uid('m'),role:'assistant',wf:lauf,ts:Date.now()};
  sess.messages.push(m);
  R.tab='sitzungen';zeigeAlles();speichern();
  R.wfCtrl=new AbortController();R.wfLaeuft=true;setzeStopp(true);
  const t0=performance.now();
  const ctx={input:eingabe};
  try{
    for(const block of wfBloecke(wf.steps)){
      if(R.wfCtrl.signal.aborted)throw {name:'AbortError'};
      await Promise.all(block.map(s=>wfSchrittLauf(s,ctx,lauf,m)));
    }
    const letzte=wf.steps[wf.steps.length-1];
    lauf.final=loesePlatzhalter((wf.output&&wf.output.trim())||('{{'+(letzte?letzte.id:'input')+'}}'),ctx).text;
  }catch(e){
    if((e&&e.name==='AbortError')&&!lauf.fehlerText)lauf.fehlerText='Abgebrochen.';
    else if(!lauf.fehlerText)lauf.fehlerText=fehlerText(e);
  }
  lauf.ms=performance.now()-t0;lauf.fertig=true;
  R.wfLaeuft=false;R.wfCtrl=null;setzeStopp(false);
  zeichneWf(m);speichern();titelAuto(sess);zeigeHud();
}
async function wfSchrittLauf(s,ctx,lauf,m){
  const zs=lauf.schritte.find(x=>x.id===s.id);
  if(s.condition&&String(s.condition).trim()&&!bedingungOk(s.condition,ctx)){
    zs.status='übersprungen';ctx[s.id]='';malPlan(m);return;
  }
  const prompt=loesePlatzhalter(s.prompt,ctx).text;
  const agent=agentVon(s.agentId);
  const versuche=(s.retries||0)+1;
  zs.status='läuft';zs.offen=true;malPlan(m);
  for(let v=0;v<versuche;v++){
    const t0=performance.now();
    const ziel={content:'',think:'',chips:[],quellen:[],bilder:[]};
    try{
      const erg=await kernLauf({cfg:agentCfg(agent),ziel,signal:R.wfCtrl.signal,
        verlaufVoll:()=>[{role:'user',content:[{type:'input_text',text:prompt}]}],
        mal:()=>{zs.aus=ziel.content;malPlan(m)}});
      zs.aus=ziel.content;zs.ms=performance.now()-t0;
      zs.tok=erg.usage.ein+erg.usage.aus;
      lauf.kosten+=kosten(agent.model,erg.usage.ein,erg.usage.aus);
      zs.status='fertig';ctx[s.id]=ziel.content;
      malPlan(m);return;
    }catch(e){
      if((e&&e.name==='AbortError')||R.wfCtrl.signal.aborted){
        zs.status='fehler';zs.fehlerText='Abgebrochen.';throw {name:'AbortError'};
      }
      zs.fehlerText=fehlerText(e);
      if(v<versuche-1)continue;
      zs.status='fehler';malPlan(m);
      lauf.fehlerText='Schritt „'+zs.titel+'“ ist nach '+versuche+' Versuch(en) gescheitert: '+zs.fehlerText;
      R.wfCtrl.abort();
      throw e;
    }
  }
}

function sprichStopp(){
  if(R.audio){try{R.audio.pause()}catch{}R.audio=null}
  if('speechSynthesis'in window){try{speechSynthesis.cancel()}catch{}}
}
async function sprich(text,beiEnde){
  if(!text){beiEnde&&beiEnde();return}
  sprichStopp();
  const klar=String(text).replace(/```[\s\S]*?```/g,' Codeblock. ').replace(/[#*_`>|]/g,'').slice(0,4000);
  const nutzeApi=S.schluessel&&S.ui.sprachmodus!=='browser';
  if(nutzeApi){
    try{
      const r=await fetch(API+'/audio/speech',{method:'POST',headers:kopfzeilen(),
        body:JSON.stringify({model:'gpt-4o-mini-tts',voice:S.ui.stimme,input:klar})});
      if(!r.ok)throw 0;
      const blob=await r.blob();
      const a=new Audio(URL.createObjectURL(blob));
      R.audio=a;
      a.onended=()=>{R.audio=null;beiEnde&&beiEnde()};
      await a.play();
      return;
    }catch{
      if(S.ui.sprachmodus==='api'){toast('Sprachausgabe über die API fehlgeschlagen.','fehler');beiEnde&&beiEnde();return}
    }
  }
  if('speechSynthesis'in window){
    const u=new SpeechSynthesisUtterance(klar);
    u.lang='de-DE';
    u.onend=()=>beiEnde&&beiEnde();
    speechSynthesis.speak(u);
  }else{toast('Keine Sprachausgabe verfügbar.','hinweis');beiEnde&&beiEnde()}
}
async function transkribiere(blob){
  try{
    const fd=new FormData();

    fd.append('language','de');
    const r=await fetch(API+'/audio/transcriptions',{method:'POST',headers:{'Authorization':'Bearer '+S.schluessel},body:fd});
    if(!r.ok)throw 0;
    const j=await r.json();
    return (j.text||'').trim();
  }catch{toast('Transkription fehlgeschlagen.','fehler');return ''}
}

function diktatUm(){
  if(R.diktat){R.diktat.stop();return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR&&S.ui.sprachmodus!=='api'){
    const erk=new SR();
    erk.lang='de-DE';erk.interimResults=true;erk.continuous=true;
    const basis=$('#eingabe').value;
