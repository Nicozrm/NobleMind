      let t='';for(const r of e.results)t+=r[0].transcript;
      $('#eingabe').value=(basis?basis+' ':'')+t;passeHoeheAn();
    };
    erk.onend=()=>{R.diktat=null;$('#mikro').classList.remove('aktiv')};
    erk.onerror=()=>{R.diktat=null;$('#mikro').classList.remove('aktiv')};
    try{erk.start();R.diktat=erk;$('#mikro').classList.add('aktiv')}
    catch{toast('Diktat konnte nicht starten.','fehler')}
  }else if(S.schluessel){
    diktatAufnahme();
  }else toast('Diktat braucht Browser-Spracherkennung oder einen API-Schlüssel.','hinweis');
}
async function diktatAufnahme(){
  try{
    const strom=await navigator.mediaDevices.getUserMedia({audio:true});
    const rek=new MediaRecorder(strom);
    const teile=[];
    rek.ondataavailable=e=>teile.push(e.data);
    rek.onstop=async()=>{
      strom.getTracks().forEach(t=>t.stop());
      $('#mikro').classList.remove('aktiv');R.diktat=null;
      const text=await transkribiere(new Blob(teile,{type:rek.mimeType||'audio/webm'}));
      if(text){const e=$('#eingabe');e.value=(e.value?e.value+' ':'')+text;passeHoeheAn()}
    };
    rek.start();
    R.diktat={stop:()=>rek.stop()};
    $('#mikro').classList.add('aktiv');
    toast('Aufnahme läuft – Mikrofon erneut antippen zum Beenden.','hinweis');
  }catch{toast('Mikrofon-Zugriff verweigert.','fehler')}
}
/* Sprachdialog: leerlauf → hört zu → verarbeitet → denkt → spricht */
function sprachOverlayAuf(){
  R.sv.aktiv=true;
  $('#sprachOv').classList.remove('aus');
  $('#svText').innerHTML='';
  svZustand('leer');
}
function sprachOverlayZu(){
  R.sv.aktiv=false;
  svHoerenStopp();sprichStopp();
  $('#sprachOv').classList.add('aus');
}
function svZustand(z){
  R.sv.zustand=z;
  $('#sprachOv').dataset.z=z;
  $('#svZustand').textContent={leer:'Leerlauf',hoert:'Hört zu …',verarbeitet:'Verarbeitet …',denkt:'Denkt …',spricht:'Spricht'}[z]||z;
  $('#svAktion').textContent=z==='hoert'?'Aufnahme beenden':z==='leer'?'Zuhören starten':'Stopp';
}
function svAktionKlick(){
  const z=R.sv.zustand;
  if(z==='leer')svHoeren();
  else if(z==='hoert')svHoerenFertig();
  else{sprichStopp();stoppe();svZustand('leer')}
}
async function svHoeren(){
  if(!R.sv.aktiv)return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  svZustand('hoert');
  if(SR&&S.ui.sprachmodus!=='api'){
    const erk=new SR();
    erk.lang='de-DE';erk.interimResults=true;
    let text='';
    erk.onresult=e=>{text='';for(const r of e.results)text+=r[0].transcript;
      $('#svText').innerHTML='<div class="frage">'+esc(text)+'</div>'};
    erk.onend=()=>{R.sv.erk=null;if(R.sv.zustand==='hoert'){text.trim()?svVerarbeite(text.trim()):svZustand('leer')}};
    erk.onerror=()=>{};
    R.sv.erk=erk;
    try{erk.start()}catch{svZustand('leer')}
  }else if(S.schluessel){
    try{
      const strom=await navigator.mediaDevices.getUserMedia({audio:true});
      const rek=new MediaRecorder(strom);
      R.sv.teile=[];
      rek.ondataavailable=e=>R.sv.teile.push(e.data);
      rek.onstop=async()=>{
        strom.getTracks().forEach(t=>t.stop());R.sv.rek=null;
        if(!R.sv.aktiv)return;
        svZustand('verarbeitet');
        const text=await transkribiere(new Blob(R.sv.teile,{type:rek.mimeType||'audio/webm'}));
        text?svVerarbeite(text):svZustand('leer');
      };
      rek.start();R.sv.rek=rek;
    }catch{toast('Mikrofon-Zugriff verweigert.','fehler');svZustand('leer')}
  }else{
    toast('Sprachdialog braucht Browser-Spracherkennung oder einen API-Schlüssel.','hinweis');
    svZustand('leer');
  }
}
function svHoerenFertig(){
  if(R.sv.erk)R.sv.erk.stop();
  else if(R.sv.rek)R.sv.rek.stop();
  else svZustand('leer');
}
function svHoerenStopp(){
  if(R.sv.erk){R.sv.erk.onend=null;try{R.sv.erk.stop()}catch{}R.sv.erk=null}
  if(R.sv.rek){R.sv.rek.onstop=null;try{R.sv.rek.stop()}catch{}R.sv.rek=null}
}
async function svVerarbeite(text){
  if(!S.schluessel){toast('Bitte zuerst den API-Schlüssel hinterlegen.','fehler');sprachOverlayZu();einstellungenAuf('engine');return}
  svZustand('denkt');
  $('#svText').innerHTML='<div class="frage">'+esc(text)+'</div><div id="svAntwort" class="md"></div>';
  const sess=aktSession(true);
  sess.messages.push({id:uid('m'),role:'user',content:text,ts:Date.now()});
  zeigeChat();speichern();
  const m=await antworte(sess,{});
  const halter=$('#svAntwort');
  if(halter)halter.innerHTML=md(m.fehler?('Fehler: '+m.fehler):m.content);
  if(!R.sv.aktiv)return;
  if(m.content&&!m.fehler){
    svZustand('spricht');
    sprich(m.content,()=>{if(R.sv.aktiv)svHoeren()});
  }else svZustand('leer');
}

function paletteEintraege(q){
  const l=q.toLowerCase();
  const eintraege=[];
  const befehle=[
    ['Neue Sitzung',()=>neueSession(true)],
    ['Einstellungen öffnen',()=>einstellungenAuf('engine')],
    ['Agenten-Editor öffnen',()=>oeffneAgenten()],
    ['Workflow-Editor öffnen',()=>oeffneWorkflows()],
    ['Maximum aktivieren',maximumAn],
    ['Bild-Studio öffnen',()=>bildStudio()],
    ['Canvas öffnen',()=>canvasOeffne('','html')],
    ['Duell-Modus umschalten',()=>{S.duell.an=!S.duell.an;speichern();toast('Duell-Modus '+(S.duell.an?'aktiv':'aus')+'.','ok')}],
    ['Zen-Modus umschalten',()=>setUiTeil('zen',!S.ui.zen)],
    ['Sitzung als Markdown exportieren',()=>exportMd()],
    ['Sitzung als JSON exportieren',()=>exportJson()],
    ['Alles exportieren',exportAlles],
    ['Importieren (JSON)',importKlick],
    ['Sitzung forken',()=>forkSession(S.aktiv)],
    ['Drucken / PDF',()=>window.print()],
    ['Tastaturübersicht',tastenAuf],
  ];
  befehle.forEach(([t,tun])=>{if(!l||t.toLowerCase().includes(l))eintraege.push({t,art:'Aktion',tun})});
  S.agents.forEach(a=>{if(!l||a.name.toLowerCase().includes(l))eintraege.push({t:a.avatar+' '+a.name+' aktivieren',art:'Agent',tun:()=>waehleAgent(a.id)})});
  S.workflows.forEach(w=>{if(!l||w.name.toLowerCase().includes(l))eintraege.push({t:'⧉ '+w.name+' starten',art:'Workflow',tun:()=>starteWorkflow(w.id)})});
  S.prompts.forEach(p=>{if(!l||p.name.toLowerCase().includes(l))eintraege.push({t:'✎ '+p.name,art:'Prompt',tun:()=>promptEinfuegen(p.id)})});
  // Volltextsuche über alle Sitzungen mit Sprung zur Fundstelle
  if(l.length>=3){
    let treffer=0;
    aussen:
    for(const s of S.sessions){
      for(const m of s.messages){
        const inhalt=m.content||(m.wf&&m.wf.final)||'';
        const pos=inhalt.toLowerCase().indexOf(l);
        if(pos>=0){
          eintraege.push({t:s.titel+' · „…'+inhalt.slice(Math.max(0,pos-16),pos+44).replace(/\s+/g,' ')+'…“',
            art:'Suche',tun:()=>blitzeZu(s.id,m.id)});
          if(++treffer>=10)break aussen;
        }
      }
    }
  }
  return eintraege.slice(0,26);
}
function paletteRender(q){

  R.palEintraege=eintraege;
  R.palIdx=Math.max(0,Math.min(R.palIdx,eintraege.length-1));
  $('#palListe').innerHTML=eintraege.length?eintraege.map((e,i)=>

async function verarbeiteSlash(text){
  const [befehl,...rest]=text.slice(1).split(/\s+/);
  const arg=rest.join(' ').trim();
  const b=(befehl||'').toLowerCase();
  if(b==='neu'){neueSession(true);return true}
  if(b==='leeren'){
    const s=aktSession();
    if(s&&await bestaetige('Sitzung leeren','Alle Nachrichten dieser Sitzung werden entfernt.','Leeren')){
      s.messages=[];s.lastId=null;zeigeChat();speichern();
    }
    return true}
  if(b==='modell'){
    if(arg){waehleModell(arg);toast('Modell: '+arg,'ok')}
    else modellPopover($('#kopfModell'));
    return true}
  if(b==='agent'){
    if(!arg){modellPopover($('#kopfModell'));return true}
    if(['kein','keiner','aus'].includes(arg.toLowerCase())){waehleAgent(null);return true}
    const a=S.agents.find(x=>x.name.toLowerCase().includes(arg.toLowerCase()));
    if(a)waehleAgent(a.id);else toast('Kein Agent namens „'+arg+'“.','fehler');
    return true}
  if(b==='workflow'){
    if(!arg){oeffneWorkflows();return true}
    const w=S.workflows.find(x=>x.name.toLowerCase().includes(arg.toLowerCase()));
    if(w)starteWorkflow(w.id);else toast('Kein Workflow namens „'+arg+'“.','fehler');
    return true}
  if(b==='skill'){
    const sk=S.skills.find(x=>x.name.toLowerCase().includes(arg.toLowerCase()));
    if(!arg||!sk){toast(arg?'Kein Skill namens „'+arg+'“.':'Nutzung: /skill <Name>','hinweis');return true}
    const bz=besitzer();bz.skills=bz.skills||[];
    const an=bz.skills.includes(sk.id);
    setSkillAn(sk.id,!an);
    toast('Skill „'+sk.name+'“ '+(an?'deaktiviert':'aktiviert')+'.','ok');
    return true}
  if(b==='max'){maximumAn();return true}
  if(b==='bild'){arg?bildErzeuge(arg):bildStudio();return true}
  if(b==='canvas'){canvasOeffne(arg||'','html');return true}
  if(b==='duell'){S.duell.an=!S.duell.an;speichern();toast('Duell-Modus '+(S.duell.an?'aktiv':'aus')+'.','ok');return true}
  if(b==='zen'){setUiTeil('zen',!S.ui.zen);return true}
  if(b==='export'){exportMd();return true}
  if(b==='hilfe'){tastenAuf();return true}
  toast('Unbekannter Befehl: /'+befehl+' – /hilfe zeigt alle Befehle.','hinweis');
  return true;
}

function connectorHinzu(label){
  const c=CONNECTOREN.find(x=>x.label===label);if(!c)return;
  if(S.mcpServer.some(m=>m.label===c.label)){toast('Connector „'+c.label+'“ ist bereits angelegt.','hinweis');return}
  S.mcpServer.push({label:c.label,url:c.url,header:''});
  S.cfg.mcps=[...new Set([...S.cfg.mcps,c.label])];
  speichern();stRender();
  toast(c.auth?('Connector „'+c.label+'“ angelegt – jetzt noch den Authorization-Header ergänzen ('+c.auth+').'):('Connector „'+c.label+'“ angelegt und aktiviert.'),'ok',6000);
  const m=S.mcpServer.find(x=>x.label===c.label);
  if(c.auth)mcpDialog(m);
}

function statTabelle(){
  const eintraege=Object.entries(S.stats);
  if(!eintraege.length)return '<p class="hinweisK">Noch keine Nutzung erfasst.</p>';
  let ein=0,aus=0,ges=0;
  const zeilen=eintraege.map(([mid,x])=>{
    ein+=x.ein;aus+=x.aus;ges+=x.kosten;
    return `<tr><td class="mono">${esc(mid)}${modellInfo(mid).geschaetzt?'&#8239;*':''}</td><td class="z">${fmtTok(x.ein)}</td><td class="z">${fmtTok(x.aus)}</td><td class="z">${x.anrufe}</td><td class="z">${fmtGeld(x.kosten)}</td></tr>`;
  }).join('');
  return `<table class="statTab"><tr><th>Modell</th><th class="z">Tokens ein</th><th class="z">Tokens aus</th><th class="z">Aufrufe</th><th class="z">Kosten</th></tr>
    ${zeilen}<tr><th>Gesamt</th><th class="z">${fmtTok(ein)}</th><th class="z">${fmtTok(aus)}</th><th class="z"></th><th class="z">${fmtGeld(ges)}</th></tr></table>
    <p class="hinweisK">*&#8239;Preise geschätzt (Standardsatz für unbekannte Modelle).</p>`;
}

async function skillDialog(sk){
  const w=await frageForm({titel:sk?'Skill bearbeiten':'Neuer Skill',gross:true,felder:[
    {k:'name',label:'Name',wert:sk?sk.name:''},
    {k:'direktive',label:'Direktiven-Zusatz',typ:'textarea',zeilen:5,wert:sk?sk.direktive:''},
    {k:'tools',label:'Server-Tools (Komma-Liste aus: web, img, code, file)',wert:sk?Object.keys(sk.tools||{}).filter(k=>sk.tools[k]).join(', '):''},
    {k:'fns',label:'Client-Funktionen (Komma-Liste)',wert:sk?(sk.fns||[]).join(', '):''},
  ],ok:'Speichern',pruefe:x=>!x.name.trim()?'Der Name fehlt.':null});
  if(!w)return;
  const tools={};
  w.tools.split(/[\s,]+/).filter(Boolean).forEach(k=>{if(['web','img','code','file'].includes(k))tools[k]=true});
  const fns=w.fns.split(/[\s,]+/).filter(Boolean);
  if(sk){sk.name=w.name.trim();sk.direktive=w.direktive;sk.tools=tools;sk.fns=fns}
  else S.skills.push({id:uid('sk'),name:w.name.trim(),direktive:w.direktive,tools,fns});
  speichern();stRender();
}
function skillExport(id){
  const sk=S.skills.find(x=>x.id===id);if(!sk)return;
  ladeHerunter('skill-'+sk.name.replace(/[^\wäöüÄÖÜß-]+/g,'_')+'.json',JSON.stringify(sk,null,2),'application/json');

async function skillLoeschen(id){

async function fnEigeneDialog(alt){
  const w=await frageForm({titel:alt?'Funktion bearbeiten':'Eigene Funktion anlegen',gross:true,felder:[
    {k:'name',label:'Name (Buchstaben, Ziffern, _)',wert:alt?alt.name:''},
    {k:'beschreibung',label:'Beschreibung (hilft dem Modell bei der Auswahl)',wert:alt?alt.beschreibung:''},
    {k:'schema',label:'JSON-Schema der Parameter',typ:'textarea',zeilen:6,wert:alt?alt.schema:'{\n  "type": "object",\n  "properties": {},\n  "required": [],\n  "additionalProperties": false\n}'},
    {k:'code',label:'JavaScript-Körper (async; „args“ ist verfügbar; return liefert das Ergebnis)',typ:'textarea',zeilen:8,wert:alt?alt.code:'return JSON.stringify(args);'},
  ],ok:'Speichern',pruefe:x=>{
    const name=x.name.trim();
    if(!/^[a-zA-Z][a-zA-Z0-9_-]{0,63}$/.test(name))return 'Ungültiger Funktionsname.';
    if(FNS[name])return 'Der Name kollidiert mit einer eingebauten Funktion.';
    if(!alt&&S.fnsEigene.some(f=>f.name===name))return 'Eine Funktion mit diesem Namen existiert bereits.';
    try{JSON.parse(x.schema)}catch(e){return 'Das Schema ist kein gültiges JSON: '+e.message}
    try{const AF=Object.getPrototypeOf(async function(){}).constructor;new AF('args',x.code)}
    catch(e){return 'Der Code kompiliert nicht: '+e.message}
    return null;
  }});
  if(!w)return;
  const name=w.name.trim();
  if(alt){delete R.fnCache[alt.code];Object.assign(alt,{name,beschreibung:w.beschreibung,schema:w.schema,code:w.code})}
  else S.fnsEigene.push({name,beschreibung:w.beschreibung,schema:w.schema,code:w.code});
  speichern();stRender();
}
async function fnEigeneLoeschen(name){
  if(!await bestaetige('Funktion löschen','„'+name+'“ wird entfernt und überall deaktiviert.'))return;
  S.fnsEigene=S.fnsEigene.filter(x=>x.name!==name);

async function mcpDialog(alt){

    {k:'label',label:'Label',wert:alt?alt.label:'',platz:'z. B. nobel'},

  if(alt)Object.assign(alt,{label:w.label.trim(),url:w.url.trim(),header:w.header.trim()});

/* ═══════════════════════════════════════ Tastatur & Start ═══════════════════════════════════════ */
function escKaskade(){
  if(R.pop){schliessePop();return}
  if(!$('#pal').classList.contains('aus')){paletteZu();return}
  if(!$('#dlg').classList.contains('aus')){const n=$('#dlgNein');if(n)n.click();return}
  if(!$('#tastenOv').classList.contains('aus')){tastenZu();return}
  if(!$('#agModal').classList.contains('aus')){agZu();return}
  if(!$('#wfModal').classList.contains('aus')){wfZu();return}
  if(!$('#stModal').classList.contains('aus')){stZu();return}
  if(document.body.classList.contains('canvas-auf')){canvasZu();return}
  if(R.sv.aktiv){sprachOverlayZu();return}
  if(R.streaming||R.wfLaeuft){stoppe();toast('Abgebrochen.','hinweis',1800);return}
}
function start(){
  lese();
  wendeUi();
  if(window.DOMPurify)DOMPurify.addHook('afterSanitizeAttributes',n=>{
    if(n.tagName==='A'){n.setAttribute('target','_blank');n.setAttribute('rel','noopener')}
  });
  if(window.mermaid){try{mermaid.initialize({startOnLoad:false,theme:'dark',securityLevel:'strict'})}catch{}}
  if(!S.sessions.length)neueSession(false);
  if(!S.aktiv||!S.sessions.some(s=>s.id===S.aktiv))S.aktiv=S.sessions[0].id;
  zeigeAlles();
  const e=$('#eingabe');
  e.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();sendenKlick()}
  });
  e.addEventListener('input',passeHoeheAn);
  e.addEventListener('paste',ev=>{
    const dateien=[...((ev.clipboardData&&ev.clipboardData.files)||[])];
    if(dateien.length){ev.preventDefault();dateien.forEach(anhangDatei)}
  });
  $('#dateiEingabe').addEventListener('change',ev=>{[...ev.target.files].forEach(anhangDatei);ev.target.value=''});
  $('#importEingabe').addEventListener('change',ev=>{if(ev.target.files[0])importVerarbeite(ev.target.files[0]);ev.target.value=''});
  const main=$('#main');
  main.addEventListener('dragover',ev=>ev.preventDefault());
  main.addEventListener('drop',ev=>{ev.preventDefault();[...((ev.dataTransfer&&ev.dataTransfer.files)||[])].forEach(anhangDatei)});
  $('#chat').addEventListener('scroll',()=>{
    const oben=$('#chat').scrollTop>8;
    $('#hd').classList.toggle('gescrollt',oben);
    $('#hd').classList.toggle('glass',oben);
  });
  $('#palEingabe').addEventListener('input',ev=>{R.palIdx=0;paletteRender(ev.target.value.trim())});
  $('#palEingabe').addEventListener('keydown',ev=>{
    if(ev.key==='ArrowDown'){ev.preventDefault();R.palIdx=Math.min(R.palIdx+1,(R.palEintraege||[]).length-1);paletteRender(ev.target.value.trim())}
    else if(ev.key==='ArrowUp'){ev.preventDefault();R.palIdx=Math.max(R.palIdx-1,0);paletteRender(ev.target.value.trim())}
    else if(ev.key==='Enter'){ev.preventDefault();paletteWahl(R.palIdx)}
  });
  document.addEventListener('keydown',ev=>{
    const mod=ev.metaKey||ev.ctrlKey;
    const k=(ev.key||'').toLowerCase();
    if(mod&&!ev.shiftKey&&k==='k'){ev.preventDefault();paletteUm()}
    else if(mod&&ev.key===','){ev.preventDefault();einstellungenAuf('engine')}
    else if(mod&&!ev.shiftKey&&k==='b'){ev.preventDefault();sidebarUm()}
    else if(mod&&ev.shiftKey&&k==='n'){ev.preventDefault();neueSession(true)}
    else if(mod&&ev.shiftKey&&k==='a'){ev.preventDefault();oeffneAgenten()}
    else if(mod&&ev.shiftKey&&k==='w'){ev.preventDefault();oeffneWorkflows()}
    else if(ev.key==='?'&&!/^(input|textarea|select)$/i.test(ev.target.tagName||'')){tastenAuf()}
    else if(ev.key==='Escape'){escKaskade()}
  });
  window.addEventListener('beforeunload',speichereJetzt);
  if(!LS_OK)toast('Vorschau-Modus: Der lokale Speicher ist in dieser Umgebung gesperrt. Nach dem Deployment (z. B. GitHub Pages) greift die Speicherung normal.','hinweis',9000);
  if(!S.schluessel)$('#leerText').textContent='Hinterlege zuerst deinen OpenAI-API-Schlüssel unter Einstellungen → Engine (⌘/Strg + ,). Er bleibt ausschließlich in deinem Browser.';
}
start();
